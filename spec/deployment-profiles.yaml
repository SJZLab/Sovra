# FTF-R001 -- frozen deployment-profile contract.
# Source: FINE_TUNING_FACTORY_RELEASE_1.md Section 79.2 (Supported placement
# profiles) and Section 79.5 (Profiles do not silently skip mandatory product
# scope). This file is a shared read contract (Section 84.3) -- the four
# `profiles` entries and their `placement`/`permitted_claim` text are the
# binding text from Section 79.2, not paraphrased summaries; refining wording
# requires the same contract-lock discipline as any other shared contract.
schema_version: 1

profiles:
  INTERNAL_COMPACT:
    placement: >-
      Several isolated CPU services on shared infrastructure; GPU training
      and inference may time-share under exclusive leases in non-live
      qualification
    permitted_claim: >-
      Internal pilot/functional qualification only until its availability
      and load targets are actually passed; no automatic HA claim
  INTERNAL_PRODUCTION:
    placement: >-
      CPU services independently replicated where required; durable
      replicated stores; distinct capacity/quotas for training and live
      inference
    permitted_claim: >-
      Production only for the measured topology and declared SLOs; reusing
      existing organization services is encouraged
  AIR_GAPPED:
    placement: >-
      A disconnected boundary applied to a compact or production placement,
      with every required artifact and service available internally
    permitted_claim: >-
      Air-gap qualified only after the offline lifecycle and
      attempted-egress evidence passes
  CONNECTED_MANAGED:
    placement: >-
      Seven Factory components may still be internal; explicitly approved
      external model/training/repository services are reachable by
      selected workers
    permitted_claim: >-
      Connected/managed capability only, never air-gapped

# FTF-R011 -- the full 43-scenario assertion-level release matrix (Section
# 79.5's worked examples generalized to every required scenario, plus
# Section 82.2's Q35-Q43 additions). Each qualification-inventory scenario
# ID maps to the distinct assertion(s) it must actually pass under; an
# internal-only/air-gap variant never substitutes for a required positive
# connected-evidence variant in a full-product release (Section 79.5, last
# paragraph; Section 84.7: "A profile denial test demonstrates denial, not
# successful implementation of its connected counterpart"). Generated by
# `scripts/validate_profile_scope.py --write` from
# `spec/qualification-inventory.json` (scenario IDs) and
# `spec/release-scope.yaml` (owners); the per-scenario uniform/split
# classification and split assertion names are authored judgment, disclosed
# in that script's module docstring, not machine-derived. Re-run `--write`
# after regenerating either source file; never hand-edit an owner or drop a
# scenario ID here.
