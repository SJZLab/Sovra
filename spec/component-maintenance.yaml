    owner: Factory implementation owner (relay/control-plane per QUEUE.md)
    support_model: community_oss_self_hosted
    spdx_license_id: Apache-2.0
    license_evidence_url: https://raw.githubusercontent.com/axolotl-ai-cloud/axolotl/main/LICENSE
    enterprise_or_proprietary_features_used: false
    security_process: >-
      Tracked via upstream GitHub Security Advisories and release notes;
      exact package/image version pinned via spec/component-lock.schema.json's
      ComponentVersionLock at onboarding (Section 64.3), not asserted here;
      no CVE/vulnerability status claimed without a real scan record.
    version_status: >-
      NOT_YET_RESOLVED -- Section 64.3 onboarding gate has not run (see
      spec/release-scope.yaml). Pinned exact version/digest is delivered by
      the component-lock qualification task (FTF-R001's ComponentVersionLock
      instance), not this task.
    export_plan: >-
      Training configs/checkpoints/adapters export as versioned artifacts to
      private object storage (Section 77.5 ComponentVersionLock + private
      artifact storage); standard PyTorch/PEFT checkpoint formats, no
      Axolotl-proprietary lock-in format.
    restore_plan: >-
      Checkpoints restorable from private artifact storage by content hash;
      covered by Section 48's backup/restore program (create -> delete ->
      restore -> verify hash).

