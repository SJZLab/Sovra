# FTF-R017 -- OSS dependency lifecycle / license record for the seven
# canonical reuse components (Section 80.4). Validated by
# scripts/validate_component_maintenance.py against
# spec/component-maintenance.schema.json.
#
# License claims are verified against each project's actual, current
# LICENSE file (real fetches performed this task, URLs recorded below),
# never asserted from memory. All seven are permissive (Apache-2.0/MIT) --
# none required adding an unapproved copyleft/enterprise dependency.
# `version_status` is honestly NOT_YET_RESOLVED for all seven, matching
# spec/release-scope.yaml's own real state (every capability's
# supported_version_profile is "NOT_YET_RESOLVED (Section 64.3 onboarding
# gate not yet run)") -- this task does not fabricate a pinned version
# ahead of that onboarding gate.

component_maintenance_records:
