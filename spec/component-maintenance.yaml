      Existing organizational deployment operated outside this Factory
      (Section 4: "Reuse actual deployment; no replacement"); its own
      operator owns patching/CVE response. The core gateway code this
      Factory calls over the API is MIT-licensed; the repository's
      separate enterprise/ directory (proprietary terms) is explicitly not
      used -- this Factory never imports or deploys enterprise/ code.
    version_status: >-
      Not a Factory-managed dependency to pin -- the organization's
      existing LiteLLM deployment's version is that deployment's own
      operational fact, observed via its API (Section 77.4), not
      pinned by spec/component-lock.schema.json the way a Factory-deployed
