      vendor availability").
    restore_plan: >-
      Section 80.4: search indexes are rebuilt only from complete
      authorized canonical source; sealed data is never restored into a
      normal index.

old_external_s3_compatibility:
  policy: >-
    The storage client
    (apps/api/app/services/storage_semantics_client.py) is
    endpoint-configurable via S3Endpoint/S3Credentials constructor
    arguments -- never a hardcoded SeaweedFS host -- so the identical
    signed-request code path qualifies the organization's real external S3
    endpoint the moment one is provisioned, without a code migration
    (Section 80.4: "Retain compatibility with organization-provided S3
    endpoints that pass policy and tests; do not silently migrate existing
    organizational data").
  no_silent_migration_statement: >-
    No task in this repository has moved, deleted, or rewritten any
    pre-existing organizational S3 data -- this is a net-new Factory
    deployment with no prior external S3 source yet. The qualification
    target today is the SeaweedFS offline fixture per Section 77.3
    (infra/internal/storage-profile.yaml); the same client code path
    qualifies a real organizational S3 endpoint once the owner provisions
    one. Nothing in this task forces or silently performs a migration
    away from any existing organizational S3 data.
