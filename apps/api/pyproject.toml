[project]
name = "sovra-api"
version = "0.0.0"
description = "Sovra Factory API + policy"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.3,<1.14",
    "psycopg[binary]>=3.2.3,<3.3",
    "sqlalchemy>=2.0.35,<2.1",
    "fastapi>=0.115.0,<0.116",
    "uvicorn>=0.31.0,<0.32",
    "authlib>=1.3.2,<1.4",
    "itsdangerous>=2.2.0,<2.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
