# FTF-1505 secret-scan allowlist.
#
# An exception silences exactly one (rule, exact matched value, file glob)
# tuple, and only with a non-empty justification -- the same discipline
# FTF-1506's own `dependency_scan_policy.yaml` already established for its
# policy exceptions (negative_acceptance: "Scanner omissions/excluded
# production dirs and actual exposed credential are release blockers" --
# an allowlist entry waives one proven-harmless, reviewed value, never a
# whole file, directory or rule).
#
# exceptions:
#   - rule: "quoted_secret_assignment"
#     value: "<exact matched value>"
#     file_glob: "path/glob/*"
#     justification: "<why this exact value is known non-secret test data>"
exceptions:
  - rule: "quoted_secret_assignment"
    value: "SECRET-EXPECTED-ANSWER-4711"
    file_glob: "apps/web/tests/*"
    justification: >-
      FTF-0602's own Playwright fixture (apps/web/tests/ftf_0602.spec.ts):
      a held-out expected-answer literal for an evaluation-case test
      fixture, not a credential. Matched only because its variable name
      is literally `SECRET`; verified by reading the file directly.
