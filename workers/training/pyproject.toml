[project]
name = "sovra-worker-training"
version = "0.0.0"
description = "Sovra training worker (Axolotl-backed)"
requires-python = ">=3.11"
dependencies = [
    # FTF-0706: the worker loads the approved base artifact's fast tokenizer
    # (`tokenizer.json`, pure data parsed by the Rust library, no code) to
    # verify it against the model config before any dataset is mounted.
    # Same package and pin workers/data already locks (FTF-0510); Axolotl
    # (docs/architecture/REFERENCE_REPOSITORIES.md) brings it too.
    "tokenizers>=0.20.3,<0.21",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
