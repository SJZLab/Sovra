FTF-1601:
  certification_state: CERTIFIED
  criticality: MUST
  description: Postgres backup
  evidence_hash: f5d3aee56da747f52c335813fc03677052bf8949
  implementation_state: IMPLEMENTED
  notes: kind=retained_feature; requirements=AF-32; scenarios=Q29, Q30; deps=FTF-0004, FTF-0102; scripts/postgres_backup.py (stdlib-only CLI/library -- no new pip dependency; shells out to the pg_dump/pg_restore/psql/openssl OS binaries already relied on elsewhere in this repo's Postgres tooling and CI environment; create_backup() captures real role/schema/RLS/version metadata -- server version, Alembic migration head revision, public-schema tables, FORCE ROW LEVEL SECURITY tables, pg_policies rows, distinct GRANT-referenced role names -- then encrypts the pg_dump with openssl aes-256-cbc/pbkdf2 and immediately self-verifies by decrypting the fresh ciphertext back and checksumming it against the original plaintext before ever returning success, per this task's own negative_acceptance clause; restore_backup() rejects a tampered backup file or the wrong key by checksum before ever invoking pg_restore, then re-derives the same metadata plus real row counts against the restored copy) + packages/contracts/{jsonschema,openapi}/16-*.{json,yaml} (frozen BackupRecord/RestoreRecord shared schemas per this task's own acceptance clause 1 and its contract_owner/shared_lock_required (contracts:16) -- the OpenAPI file declares zero paths since no live FastAPI app exists yet, same disclosed scope limit FTF-0102/FTF-0104 already established) + tests/tasks/test_ftf_1601.py (no-DB checks -- real openssl-backed encrypt/decrypt round trips including a wrong-key negative case, create_backup()/restore_backup() self-verification and cleanup logic exercised via injected fake dump/metadata callables including a fault injection that breaks the self-verification decrypt path, and a hand-rolled stdlib-only structural validator -- not the third-party jsonschema package, same reasoning as FTF-0102's own suite -- proving real BackupRecord/RestoreRecord instances satisfy the frozen contract) + tests/integration/test_postgres_backup.py (real live-Postgres proof -- seeds a real Organization row through FTF-0102's own schema, takes a real encrypted pg_dump-based backup, proves the wrong key and a tampered backup file are both rejected before any pg_restore attempt against a real database, then restores into a second, clean scratch database in the same cluster and proves the restored copy genuinely carries the same tables, FORCE ROW LEVEL SECURITY state, tenant_isolation policy and the exact seeded row by primary key -- "a backup that has never been restored does not count as validated", Section 71.2). This sandbox has no container-registry egress (same finding as FTF-0004/FTF-R017/FTF-0102/FTF-0104) -- live evidence produced locally against a directly-installed PostgreSQL 16 cluster (sovra_migrate role granted SUPERUSER locally to match the postgres:16-alpine image's own bootstrap-superuser CREATE DATABASE privilege the restore step needs). Wired into .github/workflows/ci.yml with a gate-job step (bare python3, no sqlalchemy dependency unlike FTF-0102/FTF-0104's uv run convention) and a new postgres-backup-integration job using GitHub Actions' own services postgres container plus a new apt-get postgresql-client-16 step (no prior job shelled out to pg_dump/pg_restore/psql directly).
  proof_state: L2-CERTIFIED
  proving_symbol: ''
  proving_test: tests/tasks/test_ftf_1601.py
