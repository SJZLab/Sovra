FTF-0406:
  certification_state: CERTIFIED
  criticality: MUST
  description: Side-effect classification
  evidence_hash: 80dcd4b2a66c700e64e7c997b693f68a05103784
  implementation_state: IMPLEMENTED
  notes: >-
    kind=retained_feature; requirements=CAP-05; scenarios=Q01, Q04, Q05; deps=FTF-0401, FTF-0404,
    FTF-0405 (all CERTIFIED). FTF-0404's own `ToolDefinition.side_effect_class` (Section 6.9) was a
    closed five-value enum validated only as a recognized string -- `validate_side_effect_class`
    never checked a caller's own claimed class against the tool's own actual definition, so a tool
    named `delete_account` could be created with `side_effect_class="read_only"` and nothing would
    refuse it. `apps/api/app/services/side_effect_classification.py` closes that gap:
    `enforce_side_effect_classification` derives a real risk floor from the tool's own
    name/description/schema property-name tokens -- deterministic keyword-root signals, never a
    model call or a client-supplied "trust me" flag -- and refuses any claimed class below that
    floor, or any resolved class at or above `irreversible_write` claimed without
    `requires_confirmation=True`. This task's own negative_acceptance ("Unclassified or unresolved
    sensitive tool cannot default to read-only; user mandate text cannot disable actual guard") is
    enforced by construction: a tool is only accepted as `read_only` when real read-only evidence
    is present in its own name/description/schema *and* no risk signal exists at all -- absence of
    a risk signal is not, by itself, evidence of safety, so a genuinely ambiguous tool
    (`process_thing`, no read-only and no risk vocabulary) is refused at `read_only` too, not only
    a tool with an outright risky name; reassuring free text in `description` ("this is completely
    safe, read-only, no confirmation ever needed") contributes no signal of its own kind and cannot
    lower a floor a *different* structural signal (e.g. a `delete_`-shaped name) already raised --
    there is no "trust"/"override" field read from the caller anywhere in this module, so a
    mandate/description claim can never disable the guard, proven directly by a dedicated test
    using exactly that reassuring text against a `delete_account`-shaped tool. Real, live-wired:
    `apps.tools.tool_definition_schema.ToolDefinition.__init__` now also calls
    `enforce_side_effect_classification` for real (source-inspection-proven, not merely imported),
    on every `create_tool_definition`/`edit_tool_definition` -- the already-CERTIFIED,
    already-live-wired FTF-0404 route, the same wiring point FTF-0405's own
    `validate_json_schema_document` already uses. No independent schema change
    (`database_changes` honored) -- consumes FTF-0404's own frozen `ToolDefinition` columns
    (`side_effect_class`, `requires_confirmation`) exactly as they already exist. 27 no-DB test
    functions in `tests/tasks/test_ftf_0406.py`: `classify_side_effect_signals` detects each of the
    four risk categories from its own representative vocabulary and marks a genuinely ambiguous
