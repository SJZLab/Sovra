ss, proving the foreign-tenant-row check is genuinely enforced) plus tests/integration/test_ftf_h003_cross_layer_isolation.py (real live-Postgres proof against a directly installed PostgreSQL 16 cluster, same no-registry-egress environment as FTF-0004/FTF-0102/FTF-0104/FTF-0105/FTF-R017 -- acceptance clause 1's read/write/download/job/route denial, each against two real seeded organizations -- read -- a guessed ID that is a real workspace belonging to org2 is denied while authenticated as org1, worded identically to a wholly missing ID; write -- an INSERT claiming org2's organization_id from a session whose real live context is org1 is rejected by FTF-0102's own RLS WITH CHECK policy; download -- a storage key built for org1's real seeded UUID validates true for org1 and false for org2's real seeded UUID; job -- a background-job-style session opened the naive way (bypassing tenant_scoped_session_for) and manually bound to org1 is still refused org2's real workspace; route -- a real uvicorn server over a real local socket (the same pattern tests/tasks/test_ftf_0103.py established) wires require_role and authorize_resource_ownership together on one route -- an org1 organization_admin substituting org2's real workspace ID in the path is denied even though require_role alone would have allowed the request; missing context -- a session with no tenant context ever bound is refused via FTF-0105's own require_tenant_context, not treated as an ordinary zero-row denial). shared_lock_required (migration application, security trust-boundary) -- no migration was needed; this task consumes FTF-0102's frozen organizations/workspaces tables and FTF-0105's frozen query guards exactly as delivered, adding no new entity and changing no existing one. Disclosed, not hidden -- no live FastAPI route, background-worker job runner, cache, or model-alias layer anywhere in this repository yet constructs and passes a TenantContext or calls these new modules, the same disclosed "no live caller yet" class already accepted for FTF-0005/FTF-0006/FTF-0102/FTF-0103/FTF-0104/FTF-0105 before each one's own first live caller existed; product_truth_check.py stays 1/1, unchanged, not inflated. Disclosed -- this task's own database_changes contract text differs from FTF-0105's ("Schema change required under the single-writer migration lock; exact tenant-owned fields from bound sections are frozen before fan-out") but no new column/table was needed to satisfy this task's own acceptance/negative_acceptance clauses; the frozen FTF-0102 schema already carries every tenant-owned field this task's evidence exercises. Disclosed -- resource_authorization.py's positive-path evidence, like FTF-0105's, is proven against FTF-0102's own workspaces table, the only real tenant-scoped table besides organizations itself that exists in this repository; a future tenant-scoped table gets the same generic guarantee automatically by passing its own table/id_column/organization_id_column to authorize_resource_ownership, not by re-proving this task's own evidence. Independently certified 2026-09-20 (PR#125, merge commit 94077104515f85e0ba776a38a2d058413d2fcaed) -- session-ID comparison against all 3 commits on PR#125 (session_013xKMdEcTrkvS1WEQUwDWxV) found no match with this certifying session (session_01Xpih2RaGXTP37K2PM6JYAV); read the full delivered diff directly; CI reconfirmed green (9/9) directly on the PR's real final head (312e9de), not a stale earlier commit; own re-run in a dedicated `git worktree`, fully unshallowed, against a directly-installed local PostgreSQL 16 (no container-registry egress in this sandbox, same FTF-0004/FTF-0102/FTF-0104/FTF-0105/FTF-R017 finding) -- both delivered suites (no-DB unit/fail-closed checks, full live-Postgres integration proof) clean; two own fault injections distinct from the producer's own (flipping validate_object_key_belongs_to_tenant's foreign-tenant equality check to always return True -- caught for real by the no-DB suite's own negative