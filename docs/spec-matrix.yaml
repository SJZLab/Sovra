n-role/app-role separation (every check in the live suite runs as `sovra_app`, seeding alone uses the migration-owner role) and for background-activity denial (the "job" case, a naively-opened session bypassing tenant_scoped_session_for); the "object presigned URLs" phrase is honestly scoped down to storage-key ownership validation only (`validate_object_key_belongs_to_tenant`), since no live presigned-URL-issuing route exists anywhere in this repository yet -- disclosed accurately in this task's own notes, the same disclosed-gap class already accepted for FTF-0105's own no-live-caller scope, not silently expanded past what the submission itself disclosed.
