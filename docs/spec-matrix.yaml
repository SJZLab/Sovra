    Design: the caller supplies `visible_model_ids` (the already-authorized names a real
    `GET /v1/models` call produced); this module's only job is to attach allowlisted
    `GET /model/info` fields onto exactly that set (Section 3.2's "no authorization union" applied
    to enrichment -- a strict left join, never a union: an id absent from `visible_model_ids` is
    never iterated into the result, however prominently `/model/info` advertises it, satisfying
    "metadata-only aliases are neither stored nor exposed"). `_ALLOWLISTED_MODEL_INFO_FIELDS` is an
    allow list, not a denylist (Section 65.4's "Metadata is not sent to the browser until
    secret-bearing/provider-private fields have been allowlist-filtered") -- the real gateway
    response's own sibling `litellm_params` (which carries `api_key`/`api_base`) is never even
    read by `_parse_model_info`, and a hypothetical misconfigured gateway that duplicates a
    credential-shaped field directly inside `model_info` is still dropped, since only the named
    allowlisted fields, restricted to plain JSON scalar values (never a nested dict/list under an
    allowlisted key), ever pass through. A denied/failed/malformed `/model/info` call
    (403/404/timeout/secret failure/parse failure) never drops or replaces an already-visible id
    (Section 3.1's "403/404 on enrichment does not invalidate a successful standard model list",
