    to browser or plaintext DB"): an unknown path and a soft-deleted/destroyed version both
    raise `SecretNotFoundError` via the same ordinary 404 handling; a denied token raises
    `SecretAccessDeniedError` (403); a secret past its own recorded `custom_metadata.expires_at`
