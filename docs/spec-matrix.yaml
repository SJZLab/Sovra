  implementation_state: IMPLEMENTED
  notes: kind=retained_feature; requirements=CAP-06; scenarios=Q07, Q10; deps=FTF-0103, FTF-0104 (both CERTIFIED). apps/api/app/artifacts/artifact_schema.py (trainable_artifacts table -- Section 6.7's own literal fields -- display_name/source_type/source_uri/model_family/base_model_revision/weights_digest nullable/license_id/license_accepted_by nullable/license_accepted_at nullable/trust_remote_code_allowed/required_python_packages_json/minimum_gpu_profile_json/status; source_uri is validated per source_type -- Section 65.4-style shape safety dispatched across the four allowed source_type values -- a bare 'org/repo' id for huggingface, s3://bucket/key with a valid bucket name and no '..' key traversal for private_s3, a relative path with no '..'/absolute/home-relative escape for local_filesystem, and an https:// URL with no userinfo/fragment for private_registry) + apps/api/alembic/versions/0004_trainable_artifacts.py (FORCE ROW LEVEL SECURITY scoped to app.current_organization_id, sovra_app granted SELECT/INSERT/UPDATE only -- never DELETE, since archive is a soft status='archived' transition, not row deletion, confirmed directly in the integration suite by a raw DELETE attempt against the restricted role failing) + apps/api/app/artifacts/artifact_crud.py (create/get/list/edit/accept-license/mark-ready/archive composed entirely from already-certified primitives -- TenantContext/tenant_scoped_session_for (FTF-H003), authorize_resource_ownership (FTF-H003), execute_tenant_scoped (FTF-0105); every mutation writes an audit event via FTF-0104's write_audit_event in the same transaction; apply_edits/apply_accept_license/apply_mark_ready/apply_archive are pure DB-free cores enabling no-DB status-transition/idempotency/ready-gate proof) + apps/api/app/artifacts/artifact_routes.py (build_trainable_artifact_router -- POST/GET /api/v1/organizations/{organization_id}/artifacts, GET/PATCH/DELETE .../{artifact_id}, POST .../{artifact_id}/accept-license, POST .../{artifact_id}/mark-ready) + apps/api/app/main.py (wires build_trainable_artifact_router into create_app() -- the THIRD live-wired product-runtime path in this repository, after FTF-0101's /auth/* and FTF-0201's /connections/litellm) + packages/contracts/openapi/03-interface.yaml + packages/contracts/jsonschema/03-domain.schema.json (contracts:03 lock). Scope decision (disclosed, matching the FTF-0201 precedent of an explicit, non-hidden scope narrowing) -- implements ONLY registration/storage/validation of the identity fields plus the pure ready-transition gate. Deliberately does NOT resolve source_uri against a real Hugging Face Hub/S3 bucket/local filesystem/private registry, and does NOT compute or verify weights_digest from real bytes -- those are FTF-0302 ('Hugging Face artifact resolver')/FTF-0303 ('Private S3 artifact resolver')/FTF-0304 ('Local artifact resolver')/FTF-0306 ('Base model revision/digest resolver')'s own, later, separately dependency-gated tasks; weights_digest is exposed only as a PATCH-accepted, shape-validated field for a later resolver to write through -- declaring real resolution here without a real backing call would be exactly the 'placeholder endpoint' Law 11 and this task's own acceptance clause ('no placeholder endpoints') forbid. This task's own negative_acceptance ('Unsafe URI, unknown owner or mutable unresolved revision cannot enter training as ready') is proven as three independently-isolated gates in apply_mark_ready -- (1) source_uri is re-validated defensively against its own source_type; (2) 'unknown owner' -- license_accepted_by/at must both be set, and license_accepted_by is ALWAYS server-derived from the real authenticated principal's own subject via a dedicated POST .../accept-license action, never a client-supplied field (Section 65.1's 'never trusting an arbitrary... value' applied to license attribution, not only tenant identity); (3) 'mutable unresolved revision' -- weights_digest must be resolved (non-null) AND base_model_revision must not be one of a named set of floating aliases (main/master/head/latest/stable/nightly/trunk/default, case-insensitive) via is_pinned_revision. Acceptance clause 1's 'immutable identity after resolution' is enforced by refusing ALL edits (apply_edits raises ArtifactStateError) once status is not 'registered' -- a ready or archived artifact is a closed record, register a new artifact instead, the same precedent FTF-0201 established for a revoked connection. Role gating (Section 45, applied per FTF-0106's own wide-read/narrow-write precedent, since Section 45 names no single restrictive sentence for artifacts the way it does for connections) -- ARTIFACT_READ_ROLES is every role Section 45 names (matching its generic 'viewer -- read only' baseline); ARTIFACT_WRITE_ROLES (create/edit/accept-license/mark-ready/archive) is {ml_engineer, organization_admin} (Section 45's 'ml_engineer -- datasets/training, no production approval' is the only sentence naming a role for this class of work). Files path refined from the packet's own suggested packages/model-catalog/trainableartifact_schema_api.py to apps/api/app/artifacts/ -- this repository has no Python packages/ workspace member (same FTF-0201 precedent -- packages/shared is TS-only), and this module needs the exact same FastAPI/SQLAlchemy/TenantContext composition every prior apps/api/app/ domain module already uses. tests/tasks/test_ftf_0301.py (no-DB checks -- validate_source_uri's exact named rejection cases per source_type, is_pinned_revision's exact named mutable-alias cases, TrainableArtifact.__init__ itself refusing bad input before any session/database is touched, apply_edits/apply_accept_license/apply_mark_ready/apply_archive's pure status-transition/idempotency/ready-gate rules -- including apply_mark_ready refused with BOTH reasons named when nothing is satisfied, and refused specifically for a mutable revision even once license+digest are otherwise satisfied -- and a real locally-hosted build_trainable_artifact_router proving the read/write role split and that role-boundary denial never opens a session) plus tests/integration/test_ftf_0301_trainable_artifact_schema_api.py (real live-Postgres checks -- create/get/list/edit/accept-license/mark-ready/archive for the owning organization; unsafe source_uri rejected at creation; the mark-ready negative_acceptance gate proven with THREE separate real HTTP round-trips that isolate each of its three conditions in turn -- nothing satisfied, license accepted but revision+digest still unresolved, digest resolved but revision still mutable -- before the real all-three-satisfied success; 'immutable identity after resolution' -- a PATCH against a ready artifact is refused (409); the core IDOR case -- a real artifact ID belonging to org1, requested/mutated under org2's own path by a real org2 ml_engineer -- denied identically to missing (404) for GET/PATCH/DELETE alike, with the artifact confirmed genuinely untouched afterward; archive idempotency; mark-ready refused on an archived artifact; a session with no tenant context ever bound refused via TenantContextError; sovra_app confirmed unable to issue a raw DELETE against trainable_artifacts directly; the real database unique constraint on (organization_id, display_name) rejecting a duplicate). Own fault-injection evidence (Law 1) -- widened is_pinned_revision to unconditionally return True (accepting every mutable alias as pinned) -- caught for real by both suites -- 8 no-DB checks failed (all of is_pinned_revision's own named cases plus the mark-ready mutable-revision negative check), and after strengthening the integration suite to isolate the mutable-revision gate from the digest-unresolved gate with its own independent HTTP round-trip (resolving weights_digest alone first, confirming mark-ready is STILL refused while base_model_revision is still 'main', before resolving the revision too), 2 live-Postgres checks failed for real; both reverted byte-identical and both suites re-ran clean. Disclosed, not hidden -- a duplicate-display_name create is rejected by the real database unique constraint but surfaces as an unhandled IntegrityError (HTTP 500) rather than a clean 400/409, since the create route only maps ValueError to 400 (matching FTF-0201's own identical, already-CERTIFIED precedent for its own uq_litellm_connections_organization_id_name constraint -- neither task's own acceptance/negative_acceptance clauses name a specific status code for this case, and a 500 is a real failure, never a fabricated success). License-acceptance 'workflow' (showing real license text, an org-wide license catalog/policy) is NOT this task's scope -- FTF-0305 ('License acceptance workflow')'s own, later, separately dependency-gated task; this task owns exactly the schema fields Section 6.7 names plus a real, attribution-safe accept transition. First submission (PR #135) was independently reviewed and found NOT CERTIFIED -- a real Law 1 gap, not a production defect: the live-Postgres suite's own mark-ready sequence accepted the license immediately and never isolated the 'unknown owner' leg from the other two the way it already isolated the mutable-revision leg, so a fault disabling only that check was invisible to it (caught only by the no-DB suite). Fixed and resubmitted via PR #137 (superseding #135): added one isolated live-Postgres case (separate artifact, weights_digest resolved and base_model_revision pinned via PATCH, accept-license never called, mark-ready asserted refused (409), then license accepted and mark-ready asserted to succeed (200)) -- no production code changed, since the shipped apply_mark_ready logic was already correct. Independently re-certified: session-ID clean against all 6 commits on PR #137 (session_011RJ3Ct8ASzprr1uy78r6po/session_01UFUfcwwet85jUWc3BNVoJZ, neither matching the certifying session's own ID); CI reconfirmed green (12/12) on the real final head `9bc4923`; own reproduction against a real, directly-installed local PostgreSQL 16 cluster -- both suites 'all checks passed'; own fault injection reproducing the certifier's exact fault (wrapped the license_accepted_by/at check in `False and (...)`) caught for real by exactly the new isolated case (1 FAIL) in the live-Postgres suite and by the no-DB suite, reverted byte-identical, both suites re-ran clean; the five other live-Postgres integration suites sharing this migrated database re-ran clean, confirming no regression from the merge; `product_truth_check.py --fail-on-unwired` reconfirmed 3/3; task contract re-pulled via `tools/r1_handoff.py packet FTF-0301` and both acceptance clauses plus the full three-condition negative_acceptance confirmed met, including the previously-ungapped 'unknown owner' leg now isolated against live Postgres. Merged as PR #137 (merge commit 634d59775253600a83fb0ff7c94793fa4fbb89de). Certified L2-CERTIFIED.
