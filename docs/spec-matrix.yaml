    tool, refusal of the unclassified and the unresolved-sensitive read-only cases, refusal of
    under-claiming a detected risk, the requires_confirmation guard at and above
    `irreversible_write`, that over-classification is allowed (a floor, never a ceiling), the
    reassuring-description negative case above, and refusal of an unrecognized claimed class; three
