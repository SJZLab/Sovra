[project]
name = "sovra"
version = "0.0.0"
description = "Sovra (Model Factory) — Python workspace root"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "apps/api",
  "workers/training",
  "workers/evaluation",
  "workers/data",
  "workers/deploy",
]

[dependency-groups]
dev = [
  "ruff>=0.6.9,<0.7",
  "mypy>=1.11.2,<1.12",
  "types-PyYAML>=6.0.12,<6.1",
  "pytest>=9.1.1,<9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api", "workers/training", "workers/evaluation", "workers/data", "workers/deploy"]
# tools/r1_handoff.py is a faithful extraction of the Release 1 master spec's
# own Section 86 helper (FINE_TUNING_FACTORY_RELEASE_1.md) — excluded from both
# lint and format so it stays byte-for-byte identical to that source rather
# than being reformatted or rewritten to satisfy line-length/lambda rules.
extend-exclude = ["tools/r1_handoff.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# tools/r1_handoff.py: see the matching ruff per-file-ignore note above — kept
# byte-identical to the master spec's own Section 86, not type-annotated here.
exclude = ["\\.venv/", "^tools/r1_handoff\\.py$"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
