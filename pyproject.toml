[project]
name = "sovra"
version = "0.0.0"
description = "Sovra (Model Factory) — Python workspace root"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "apps/api",
  "workers/training",
  "workers/evaluation",
  "workers/data",
  "workers/deploy",
]

[dependency-groups]
dev = [
  "ruff>=0.6.9,<0.7",
  "mypy>=1.11.2,<1.12",
  "pyyaml>=6.0.1,<6.1",
  "types-PyYAML>=6.0.12,<6.1",
  "pytest>=9.1.1,<9.2",
  # FTF-0101: real local OIDC provider for tests/integration/test_oidc_login_real_provider.py
  # (owner-approved 2026-09-19, QUEUE.md "Blocked" history) -- dev/test-only, never imported
  # by any production apps/api runtime path.
  "idpyoidc>=5.0.0,<5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api", "workers/training", "workers/evaluation", "workers/data", "workers/deploy"]
# tools/r1_handoff.py is a faithful extraction of the Release 1 master spec's
# own Section 86 helper (FINE_TUNING_FACTORY_RELEASE_1.md) — excluded from both
# lint and format so it stays byte-for-byte identical to that source rather
# than being reformatted or rewritten to satisfy line-length/lambda rules.
# .claude/skills/ui-ux-pro-max is vendored third-party code (MIT, pinned upstream commit - see its
# VENDORED.md), kept identical to upstream; it is a dev-time design reference, not product code.
extend-exclude = ["tools/r1_handoff.py", ".claude/skills/ui-ux-pro-max"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Matches the Python version CI actually runs (every actions/setup-python step
# in .github/workflows/ci.yml pins '3.12', not 3.11; requires-python above is
# only the declared minimum). numpy 2.5.x's bundled .pyi stubs use unconditional
# PEP 695 `type` alias statements; mypy only parses that stub syntax when its
# own --python-version target is >=3.12, independent of the numpy version or of
# this project's own source syntax. Pinning this below the interpreter CI
# actually uses broke on any dependency whose stubs adopt PEP 695, not just
# this one -- so this tracks the real CI toolchain instead.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# tools/r1_handoff.py: see the matching ruff per-file-ignore note above — kept
# byte-identical to the master spec's own Section 86, not type-annotated here.
exclude = ["\\.venv/", "^tools/r1_handoff\\.py$", "^\\.claude/skills/ui-ux-pro-max/"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
