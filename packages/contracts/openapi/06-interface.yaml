openapi: 3.1.0
info:
  title: Sovra Phase 06 Interface (EvaluationSuite)
  version: 0.1.0
  description: >-
    Frozen shared component schemas and real live routes for the
    project-scoped EvaluationSuite resource (Section 23-30/69/45/65-67/77/
    81, FTF-0601). `paths` declares exactly the surface the tasks owning
    this file actually implement and wire into `apps/api/app/main.py`:
    create/get/list/update/lock of the suite record (FTF-0601) and the
    suite's evaluation cases -- all-or-nothing import, cursor list, get and
    edit (FTF-0602-P1, Section 6.14/23-24/26-27/69.1-69.2). It deliberately
    does not declare an `/evaluations/results` route (Section 25's own real
    runtime-execution loop) or a `/comparisons` route (Section 28's own
    baseline-comparison surface): neither entity/capability exists anywhere
    in this repository yet. Declaring any of them as a real, enforced
    endpoint here without a real backing implementation would be exactly
    the "placeholder endpoint" Law 11 forbids. Whichever later task adds its
    own real route extends this same file under this same contract-owner
    lock (shared_lock_required: contracts:06).
paths:
  /api/v1/organizations/{organization_id}/projects/{project_id}/evaluation-suites:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a project's evaluation suites, ordered by version.
      operationId: listEvaluationSuites
      responses:
        '200':
          description: The project's evaluation suites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationSuite'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The authenticated principal's role does not permit reading
            this project's evaluation suites (Section 45's widest read
            baseline -- every role Section 45 names).
        '404':
          description: project_id missing or belongs to a different organization.
    post:
      summary: >-
        Create a new draft evaluation suite at the next version number for
        this project. `agent_manifest_id` must reference a real, already-
        `locked` AgentManifest belonging to this same project (Section
        23-30/69) -- refused with 409 otherwise.
      operationId: createEvaluationSuite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationSuiteCreateRequest'
      responses:
        '201':
          description: The created draft evaluation suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSuite'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The authenticated principal's role does not permit creating an
            evaluation suite for this project (Section 45: "evaluator:
            create/run evaluation, no deployment" -- {evaluator,
            workspace_admin, organization_admin} alone).
        '404':
          description: >-
            project_id or agent_manifest_id missing, or belongs to a
            different organization -- identical in every case.
        '409':
          description: >-
            agent_manifest_id exists but belongs to a different project
            than the one named in the path, or is not currently `locked`
            -- this task's own negative_acceptance, "Wrong project/
            manifest ... rejected".
  /api/v1/organizations/{organization_id}/projects/{project_id}/evaluation-suites/{suite_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one evaluation suite.
      operationId: getEvaluationSuite
      responses:
        '200':
          description: The evaluation suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSuite'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The authenticated principal's role does not permit reading
            this project's evaluation suites.
        '404':
          description: >-
            Missing, belongs to a different organization, or belongs to a
            different project than the one named in the path -- identical
            in every case.
    patch:
      summary: >-
        Edit mutable fields (name/grading_logic_version/reviewer_id) on a
        draft suite. `agent_manifest_id`/`purpose`/`version` are never
        accepted here -- all three are fixed at creation.
      operationId: updateEvaluationSuite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationSuiteUpdateRequest'
      responses:
        '200':
          description: The updated evaluation suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSuite'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The authenticated principal's role does not permit editing
            this project's evaluation suites.
        '404':
          description: >-
            Missing, belongs to a different organization, or belongs to a
            different project than the one named in the path -- identical
            in every case.
        '409':
          description: The suite is already locked.
  /api/v1/organizations/{organization_id}/projects/{project_id}/evaluation-suites/{suite_id}/lock:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Transition a suite: draft -> locked. Requires a reviewer_id
        already assigned; for a `final`-purpose suite, that reviewer must
        differ from the suite's own created_by (Section 69.1: "Final
        suite creator/reviewer is independent of candidate implementer").
        FTF-0603-F1: the body carries the reviewer's sample plan and the
        suite_sha256 they reviewed; after FTF-0601's checks the server
        validates the plan floors, every case and the hash, records the
        plan (insert-only) and stores suite_sha256 on lock. Any failed rule
        is a typed 409 and the suite stays draft.
      operationId: lockEvaluationSuite
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationSuiteLockRequest'
      responses:
        '200':
          description: The locked evaluation suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSuite'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The authenticated principal's role does not permit
            transitioning this project's evaluation suites.
        '404':
          description: >-
            Missing, belongs to a different organization, or belongs to a
            different project than the one named in the path -- identical
            in every case.
        '400':
          description: >-
            Malformed lock body: `{"detail": {"code": "invalid_lock_request",
            "field": <field>}}`, never echoing the value.
        '409':
          description: >-
            The suite is already locked, has no reviewer_id assigned, or
            (for a final-purpose suite) reviewer_id equals created_by
            (FTF-0601, a string detail); or (FTF-0603-F1) the lock gate
            refused it, with one typed finding per violated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSuiteLockRefusal'
  /api/v1/organizations/{organization_id}/projects/{project_id}/evaluation-suites/{suite_id}/cases:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        List a suite's cases ordered by case_key, `limit` at a time. For a
        final-purpose suite only evaluator, workspace_admin and
        organization_admin may read (Section 69.1).
      operationId: listEvaluationCases
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: after
          in: query
          required: false
          description: The `next_after` of the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: One page of cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCasePage'
        '400':
          $ref: '#/components/responses/CaseValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            `role_not_authorized`, or `final_suite_content_restricted` when
            the suite is final-purpose and the role is not evaluator /
            workspace_admin / organization_admin. No case content is
            returned.
        '404':
          description: >-
            Suite missing, in a different organization, or in a different
            project -- identical in every case (`not_found`).
    post:
      summary: >-
        Import 1..500 cases into a draft suite, all or nothing: one invalid
        row, a repeated case_key, or an existing case_key inserts nothing.
        Takes the suite row lock; writes the `evaluation_case.import` audit
        event.
      operationId: importEvaluationCases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCaseImportRequest'
      responses:
        '201':
          description: The created cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCaseItems'
        '400':
          $ref: '#/components/responses/CaseValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            `role_not_authorized` (writes are {evaluator, workspace_admin,
            organization_admin}, FTF-0601's own set) or
            `final_suite_content_restricted`.
        '404':
          description: Suite missing, foreign or in another project (`not_found`).
        '409':
          description: >-
            `suite_locked` (the suite is no longer a draft) or
            `duplicate_case_key`.
  /api/v1/organizations/{organization_id}/projects/{project_id}/evaluation-suites/{suite_id}/cases/{case_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one case. Final-purpose suites follow the same read restriction as the list.
      operationId: getEvaluationCase
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCase'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` or `final_suite_content_restricted`.'
        '404':
          description: Suite or case missing, foreign or in another project (`not_found`).
    patch:
      summary: >-
        Edit the named fields of a case in a draft suite. `case_key` is
        immutable. Writes the `evaluation_case.update` audit event with the
        field names only.
      operationId: updateEvaluationCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCasePatchRequest'
      responses:
        '200':
          description: The updated case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCase'
        '400':
          $ref: '#/components/responses/CaseValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` or `final_suite_content_restricted`.'
        '404':
          description: Suite or case missing, foreign or in another project (`not_found`).
        '409':
          description: '`suite_locked`.'
components:
  responses:
    NotAuthenticated:
      description: No authenticated session.
    ValidationFailed:
      description: The request body failed schema/policy validation.
    CaseValidationFailed:
      description: >-
        The request failed validation. Each error names the row (`index`,
        null for a non-row error), the field and a stable code; it never
        carries the submitted value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvaluationCaseValidationError'
  schemas:
    EvaluationSuitePurpose:
      type: string
      enum: [development, final]
    EvaluationSuiteStatus:
      type: string
      enum: [draft, locked]
    EvaluationSuiteCreateRequest:
      type: object
      properties:
        agent_manifest_id:
          type: string
          format: uuid
          description: >-
            Fixed for this suite's entire lifetime. Must reference an
            already-`locked` AgentManifest belonging to the same project.
        purpose:
          $ref: '#/components/schemas/EvaluationSuitePurpose'
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Must contain at least one non-whitespace character; whitespace-only is refused.
        grading_logic_version:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >-
            Must always be an explicit positive integer -- this task's
            own negative_acceptance, "unversioned grading logic ...
            rejected". Capped at the Postgres Integer column's own
            4-byte signed range.
        reviewer_id:
          type: [string, 'null']
      required: [agent_manifest_id, purpose, name, grading_logic_version]
      additionalProperties: false
    EvaluationSuiteUpdateRequest:
      type: object
      description: Any non-empty subset of the mutable fields. Refused once locked.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Must contain at least one non-whitespace character; whitespace-only is refused.
        grading_logic_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        reviewer_id:
          type: [string, 'null']
      additionalProperties: false
    EvaluationSuite:
      type: object
      description: Section 23-30/69 -- the read-facing representation of a project's own EvaluationSuite.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        agent_manifest_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/EvaluationSuiteStatus'
        purpose:
          $ref: '#/components/schemas/EvaluationSuitePurpose'
        name:
          type: string
        grading_logic_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        reviewer_id:
          type: [string, 'null']
        created_by:
          type: string
        locked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        suite_sha256:
          description: >-
            FTF-0603-F1: the canonical hash the suite was locked at (null
            while draft). Canonical JSON (keys in UTF-16 order, ECMAScript
            numbers), UTF-8, SHA-256; shared vector
            packages/contracts/test-vectors/evaluation-suite-sha256.json.
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
      required:
        - id
        - organization_id
        - project_id
        - agent_manifest_id
        - version
        - status
        - purpose
        - name
        - grading_logic_version
        - reviewer_id
        - created_by
        - locked_at
        - created_at
      additionalProperties: false
    EvaluationSuiteSamplePlan:
      type: object
      description: >-
        FTF-0603-F1 (Section 26/69.2/69.3): the reviewer's sample plan.
        Counts are distinct group_key values. Floors: at least one
        category, min_independent_tasks >= 1, min_cases_per_category >= 1;
        a final suite also needs min_independent_tasks >= 1000 and
        min_critical_scenarios >= 100 (a below-floor plan is a 409
        sample_plan_below_floor, not a 400). A final plan must also list
        every EvaluationSuiteSection26Category.
      properties:
        required_categories:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        min_independent_tasks:
          type: integer
          minimum: 0
          maximum: 1000000
        min_critical_scenarios:
          type: integer
          minimum: 0
          maximum: 1000000
        min_cases_per_category:
          type: integer
          minimum: 0
          maximum: 1000000
      required:
        - required_categories
        - min_independent_tasks
        - min_critical_scenarios
        - min_cases_per_category
      additionalProperties: false
    EvaluationSuiteSection26Category:
      type: string
      description: >-
        FTF-0603-F1: Section 26's categories, verbatim. A final suite's
        sample plan must list every one in required_categories (each one
        left out is a missing_critical_category finding); project-specific
        categories are added on top.
      enum:
        - 'happy-path tasks'
        - 'ambiguous input'
        - 'missing information'
        - 'invalid input'
        - 'incorrect user assumption'
        - 'tool failure'
        - 'tool timeout'
        - 'permission denied'
        - 'malformed tool result'
        - 'partial tool result'
        - 'conflicting tool results'
        - 'multi-turn task'
        - 'long context'
        - 'retry/recovery'
        - 'refusal'
        - 'prompt injection'
        - 'unauthorized tool use'
        - 'critical side-effect prevention'
        - 'schema compliance'
        - 'loop prevention'
        - 'termination correctness'
        - 'cost efficiency'
    EvaluationSuiteLockRequest:
      type: object
      description: >-
        Both fields may be absent at the shape level; an absent plan or
        hash is a typed 409 finding (sample_plan_missing /
        suite_sha256_required).
      properties:
        sample_plan:
          oneOf:
            - $ref: '#/components/schemas/EvaluationSuiteSamplePlan'
            - type: 'null'
        suite_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
      additionalProperties: false
    EvaluationSuiteLockFinding:
      type: object
      description: >-
        One violated lock rule. subject is a plan field, a category or a
        case_key -- never an expected value.
      properties:
        code:
          type: string
          enum:
            - sample_plan_missing
            - sample_plan_below_floor
            - no_cases
            - insufficient_independent_tasks
            - insufficient_critical_scenarios
            - missing_critical_category
            - insufficient_category_sample
            - unresolved_expected_output
            - non_canonical_number
            - suite_sha256_required
            - suite_sha256_mismatch
        subject:
          type: [string, 'null']
        need:
          type: [integer, 'null']
        have:
          type: [integer, 'null']
      required: [code, subject, need, have]
      additionalProperties: false
    EvaluationSuiteLockRefusal:
      type: object
      properties:
        detail:
          type: object
          properties:
            code:
              type: string
              enum: [suite_lock_validation_failed]
            findings:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/EvaluationSuiteLockFinding'
          required: [code, findings]
          additionalProperties: false
      required: [detail]
    EvaluationCaseSeverity:
      type: string
      enum: [low, medium, high, critical]
    EvaluationCaseGraderType:
      type: string
      description: Section 23's 13 grader types.
      enum:
        - exact_match
        - json_schema
        - tool_name
        - tool_arguments
        - tool_sequence
        - state_transition
        - forbidden_action
        - required_refusal
        - contains_fact
        - numeric_tolerance
        - latency
        - cost
        - llm_judge
    EvaluationCaseInput:
      type: object
      description: >-
        One case to import. `critical: true` requires a grader_type of
        tool_name, tool_arguments, tool_sequence, state_transition,
        forbidden_action or required_refusal (Section 27 / 69.2); anything
        else is refused with `critical_oracle_not_independent`.
      properties:
        case_key:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique within the suite; immutable; no leading or trailing whitespace.
        category:
          type: string
          minLength: 1
          maxLength: 100
        severity:
          $ref: '#/components/schemas/EvaluationCaseSeverity'
        critical:
          type: boolean
          default: false
        language:
          type: string
          minLength: 1
          maxLength: 35
        group_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Cluster identity (Section 69.2): turns of one conversation and
            template-derived near duplicates share a group_key. Required,
            never defaulted, so effective n is not inflated by omission.
        input_json:
          type: object
          description: A JSON object of at most 2 MiB.
        expected_json:
          type: object
          minProperties: 1
          description: A non-empty JSON object of at most 2 MiB.
        grader_type:
          $ref: '#/components/schemas/EvaluationCaseGraderType'
        grader_config_json:
          type: object
          default: {}
          description: A JSON object of at most 2 MiB.
        weight:
          type: number
          exclusiveMinimum: 0
          default: 1
      required:
        - case_key
        - category
        - severity
        - language
        - group_key
        - input_json
        - expected_json
        - grader_type
      additionalProperties: false
    EvaluationCaseImportRequest:
      type: object
      properties:
        cases:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/EvaluationCaseInput'
      required: [cases]
      additionalProperties: false
    EvaluationCasePatchRequest:
      type: object
      description: >-
        A non-empty subset of the mutable fields. `case_key` is immutable and
        is refused with code `immutable`. The merged case must still satisfy
        the critical-oracle rule.
      minProperties: 1
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 100
        severity:
          $ref: '#/components/schemas/EvaluationCaseSeverity'
        critical:
          type: boolean
        language:
          type: string
          minLength: 1
          maxLength: 35
        group_key:
          type: string
          minLength: 1
          maxLength: 200
        input_json:
          type: object
        expected_json:
          type: object
          minProperties: 1
        grader_type:
          $ref: '#/components/schemas/EvaluationCaseGraderType'
        grader_config_json:
          type: object
        weight:
          type: number
          exclusiveMinimum: 0
      additionalProperties: false
    EvaluationCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        suite_id:
          type: string
          format: uuid
        case_key:
          type: string
        category:
          type: string
        severity:
          $ref: '#/components/schemas/EvaluationCaseSeverity'
        critical:
          type: boolean
        language:
          type: string
        group_key:
          type: string
        input_json:
          type: object
        expected_json:
          type: object
        grader_type:
          $ref: '#/components/schemas/EvaluationCaseGraderType'
        grader_config_json:
          type: object
        weight:
          type: number
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - organization_id
        - project_id
        - suite_id
        - case_key
        - category
        - severity
        - critical
        - language
        - group_key
        - input_json
        - expected_json
        - grader_type
        - grader_config_json
        - weight
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    EvaluationCaseItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCase'
      required: [items]
      additionalProperties: false
    EvaluationCasePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCase'
        next_after:
          type: [string, 'null']
          description: The case_key to pass as `after` for the next page; null on the last page.
      required: [items, next_after]
      additionalProperties: false
    EvaluationCaseFieldError:
      type: object
      properties:
        index:
          type: [integer, 'null']
        field:
          type: [string, 'null']
        code:
          type: string
          enum:
            - required
            - invalid_type
            - invalid_value
            - too_long
            - too_large
