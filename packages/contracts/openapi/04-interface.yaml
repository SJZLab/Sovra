openapi: 3.1.0
info:
  title: Sovra Phase 04 Interface (Project)
  version: 0.1.0
  description: >-
    Frozen shared component schemas and real live routes for the
    workspace-scoped Project resource (Section 6.8/7A/22/45/65-66/77/81,
    FTF-0401), the project-scoped ToolDefinition resource (Section
    6.9/7A/22/45/65-66/77/81, FTF-0404), and the read-only
    CriticalBehaviorRequirement view over that same resource (Section
    6.9/7A.6/22/45/65-66/77/81, FTF-0407) -- each extending this same
    contract-owner-locked file per its own original note below.
    `paths` declares exactly the surface each task actually implements
    and wires into `apps/api/app/main.py` -- Project's own create/get/
    list/edit/save-ui-state/archive, ToolDefinition's own create/get/
    list/edit, and `/requirements`'s own read-only list -- and nothing
    else. `/requirements` is deliberately GET-only: it is a derived
    projection over already-enforced `ToolDefinition` fields, never a
    separately stored claim (see
    `app.services.critical_behavior_requirements`'s own module
    docstring) -- FTF-0408 ("Requirements UI")'s own, later, separately
    dependency-gated task assembles this alongside project privacy/budget
    policy into one screen; it does not add its own new route here.
    Whichever later task adds its own real route extends this same file
    under this same contract-owner lock (shared_lock_required:
    contracts:04).
paths:
  /api/v1/organizations/{organization_id}/projects:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the organization's projects.
      operationId: listProjects
      responses:
        '200':
          description: The organization's projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
    post:
      summary: >-
        Create a new project. `status` is always server-derived from
        `project_type` (never client-supplied) -- an agentic_product
        project always starts `setup_incomplete`.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: workspace_id missing or belongs to a different organization -- identical.
  /api/v1/organizations/{organization_id}/projects/{project_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one project.
      operationId: getProject
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing or belongs to a different organization -- identical in both cases.
    patch:
      summary: >-
        Edit a non-archived project's mutable fields. `project_type` is
        immutable and never accepted here. `expected_row_version` is
        required (optimistic concurrency); a mismatch is refused (409).
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing or belongs to a different organization -- identical.
        '409':
          description: The project is archived, or expected_row_version does not match.
    delete:
      summary: Archive (soft-delete) a project. Idempotent.
      operationId: archiveProject
      responses:
        '200':
          description: >-
            The project in its archived state -- returned unchanged, with
            no new audit event, if it was already archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing or belongs to a different organization -- identical.
  /api/v1/organizations/{organization_id}/projects/{project_id}/ui-state:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Save the project's client-draft UI state (e.g. wizard progress).
        Bounded size; does not bump row_version (not a versioned setting).
      operationId: saveProjectUiState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUiStateSaveRequest'
      responses:
        '200':
          description: The project with its saved ui_state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing or belongs to a different organization -- identical.
        '409':
          description: The project is archived.
  /api/v1/organizations/{organization_id}/projects/{project_id}/tools:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the project's current tool definitions (one row per tool name).
      operationId: listToolDefinitions
      responses:
        '200':
          description: The project's current tool definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolDefinition'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
    post:
      summary: >-
        Create version 1 of a new tool definition. A second create with
        the same name while a current version already exists is refused
        by the real database's own partial unique constraint.
      operationId: createToolDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDefinitionCreateRequest'
      responses:
        '201':
          description: The created tool definition (version 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: project_id missing or belongs to a different organization -- identical.
  /api/v1/organizations/{organization_id}/projects/{project_id}/tools/{tool_definition_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tool_definition_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one tool definition version (current or historical) by ID.
      operationId: getToolDefinition
      responses:
        '200':
          description: The tool definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDefinition'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            Missing, belongs to a different organization, or belongs to a
            different project than the one named in the path -- identical
            in every case.
    patch:
      summary: >-
        Edit the current version of a tool definition. Never mutates the
        existing row in place: creates version N+1 (previous_version_id
        set to the row it replaces) and marks the prior row
        superseded_at, whose own content fields are left byte-identical.
        Editing anything but the current version (e.g. a
        previous_version_id already superseded) is refused (409).
      operationId: editToolDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDefinitionEditRequest'
      responses:
        '200':
          description: The new current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing, wrong organization, or wrong project -- identical.
        '409':
          description: The named row is not the current version of this tool.
  /api/v1/organizations/{organization_id}/projects/{project_id}/requirements:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        List the project's current critical-behavior-requirement view, one
        row per current ToolDefinition. Derived and read-only -- every row
        already passed enforce_critical_behavior_requirement at write
        time, this endpoint only reports that already-enforced state.
      operationId: listCriticalBehaviorRequirements
      responses:
        '200':
          description: The project's current critical-behavior-requirement view.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CriticalBehaviorRequirement'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
components:
  responses:
    NotAuthenticated:
      description: No authenticated session.
    RoleNotAuthorized:
      description: >-
        The authenticated principal's role in this organization does not
        permit this operation (Section 45: reads are open to every named
        role; create/edit/save-ui-state/archive require workspace_admin or
        organization_admin).
    ValidationFailed:
      description: The request body failed schema/policy validation.
  schemas:
    ProjectType:
      type: string
      enum: [agentic_product, generic_model_tuning]
    ProjectStatus:
      type: string
      enum: [setup_incomplete, active, archived]
    ProjectCreateRequest:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        project_type:
          $ref: '#/components/schemas/ProjectType'
        description:
          type: [string, 'null']
          maxLength: 4000
        agent_objective:
          type: [string, 'null']
          maxLength: 4000
          description: Required non-empty for agentic_product; must be null/absent for generic_model_tuning.
        security_profile:
          type: string
          minLength: 1
          maxLength: 64
          default: standard
      required: [workspace_id, name, project_type]
      additionalProperties: false
    ProjectUpdateRequest:
      type: object
      description: >-
        Any non-empty subset of the mutable fields, plus the required
        expected_row_version. Refused (409) once archived or on a
        row_version mismatch.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 4000
        agent_objective:
          type: [string, 'null']
          maxLength: 4000
        security_profile:
          type: string
          minLength: 1
          maxLength: 64
        expected_row_version:
          type: integer
      required: [expected_row_version]
      additionalProperties: false
    ProjectUiStateSaveRequest:
      type: object
      properties:
        ui_state:
          type: object
      required: [ui_state]
      additionalProperties: false
    Project:
      type: object
      description: The read-facing representation.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        project_type:
          $ref: '#/components/schemas/ProjectType'
        agent_objective:
          type: [string, 'null']
        security_profile:
          type: string
        budget_policy_id:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/ProjectStatus'
        ui_state:
          type: object
        row_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
      required:
        - id
        - organization_id
        - workspace_id
        - name
        - project_type
        - security_profile
        - status
        - row_version
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    ToolSideEffectClass:
      type: string
      enum: [read_only, reversible_write, irreversible_write, financial, privileged]
    ToolDefinitionCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        description:
          type: [string, 'null']
          maxLength: 4000
        input_schema:
          type: object
        output_schema:
          type: object
        side_effect_class:
          $ref: '#/components/schemas/ToolSideEffectClass'
        requires_confirmation:
          type: boolean
          default: false
        is_critical:
          type: boolean
          default: false
      required: [name, input_schema, output_schema, side_effect_class]
      additionalProperties: false
    ToolDefinitionEditRequest:
      type: object
      description: >-
        Any non-empty subset of the mutable fields. Never edits the named
        row in place -- creates a new version. Refused (409) unless the
        named row is the current version.
      properties:
        description:
          type: [string, 'null']
          maxLength: 4000
        input_schema:
          type: object
        output_schema:
          type: object
        side_effect_class:
          $ref: '#/components/schemas/ToolSideEffectClass'
        requires_confirmation:
          type: boolean
        is_critical:
          type: boolean
      additionalProperties: false
    ToolDefinition:
      type: object
      description: Section 6.9 -- one immutable version of a project's tool schema.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        input_schema:
          type: object
        output_schema:
          type: object
        side_effect_class:
          $ref: '#/components/schemas/ToolSideEffectClass'
        requires_confirmation:
          type: boolean
        is_critical:
          type: boolean
        version:
          type: integer
        schema_hash:
          type: string
        previous_version_id:
          type: [string, 'null']
          format: uuid
        superseded_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - organization_id
        - project_id
        - name
        - input_schema
        - output_schema
        - side_effect_class
        - requires_confirmation
        - is_critical
        - version
        - schema_hash
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    CriticalBehaviorRequirement:
      type: object
      description: >-
        Section 6.9/7A.6 -- the derived critical-behavior-requirement view
        for one current ToolDefinition. `measurable`/`runtime_enforced`
        describe why this row's own is_critical/side_effect_class pair is
        already consistent (FTF-0407's own enforce_critical_behavior_requirement
        refuses any row for which they would not be), they are not a
        separate re-validation.
      properties:
        tool_definition_id:
          type: string
          format: uuid
        name:
          type: string
        side_effect_class:
          $ref: '#/components/schemas/ToolSideEffectClass'
        is_critical:
          type: boolean
        requires_confirmation:
          type: boolean
        measurable:
          type: boolean
          description: >-
            False only for a read_only tool -- a read_only resolution has
            no enforced side effect for a deterministic outcome test or
            runtime enforcement mechanism to bind to.
        runtime_enforced:
          type: boolean
          description: Mirrors requires_confirmation -- whether a real runtime guard applies.
      required:
        - tool_definition_id
        - name
        - side_effect_class
        - is_critical
        - requires_confirmation
        - measurable
        - runtime_enforced
      additionalProperties: false
