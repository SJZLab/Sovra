openapi: 3.1.0
info:
  title: Sovra Phase 05 Interface (DatasetSourceConnection, Dataset)
  version: 0.1.0
  description: >-
    Frozen shared component schemas and real live routes for the
    project-scoped DatasetSourceConnection resource (Section 6.8F/7A.10/9/
    45/65-67/77/81, FTF-0500). `paths` declares exactly the surface this
    task actually implements and wires into `apps/api/app/main.py` --
    create/get/list/edit/revoke plus one real authorization check
    (`/authorize`) -- and nothing else. It deliberately does not declare a
    `/preview` or `/import` route: no `Dataset` entity exists anywhere in
    this repository yet to import into (Section 8's own dataset import
    pipeline is a later, separately dependency-gated task). Whichever
    later task adds its own real route (dataset import, source
    validation) extends this same file under this same contract-owner
    lock (shared_lock_required: contracts:05).

    FTF-0501-P1 adds the read surface of dataset versions (`GET
    .../datasets`, `GET .../datasets/{dataset_id}`) and freezes the
    upload-session request/response components (`UploadSessionCreateRequest`,
    `UploadSession`, `UploadFinalizeRequest`); FTF-0501 adds the upload-session,
    part-listing, part-URL and finalize routes with their handlers under this
    same lock.
    Responses never carry an object key, bucket or storage URI.

    FTF-0516-P1 adds the dataset quality surface under `.../datasets/{dataset_id}`:
    `quality-report`, `issues`, `issues/{issue_id}`, `resolve-issue` and
    `issue-resolutions`. Responses carry digests, positions, indices and codes
    only, never record content or a detector message.

    FTF-0519-P2 adds the immutable split manifest surface under
    `.../projects/{project_id}/dataset-splits`: list, get, `approve` and `reject`.
    There is no create route (a proposal comes from the data worker). Responses carry
    counts, role hashes, sources, frozen grants, status and hashes and a finding-count
    leakage summary; never an assignment, a record id, a group id, a finding, a review
    text or a storage key.

    FTF-H011-P3 adds the dataset field mapping surface under
    `.../projects/{project_id}/datasets/{dataset_id}`: `mapping-probe`, `mapping-preview`,
    `mappings` (propose, list), `mappings/{mapping_id}` (get), and `approve` / `reject`. The
    `DatasetMappingSpec` component mirrors the certified FTF-0502-P1 grammar
    (`mapping_from_object`): a document is schema-valid exactly when that parser accepts it.
    Values of a probe or preview are masked (`{"masked": true, "chars": n}`) unless the caller is an
    admin or an ml_engineer on a public or internal connection, and a stored mapping's document and
    rationale are then withheld. Responses never carry an object key, a bucket or a credential.
    Integer-valued fields must be JSON integer literals (`1`, not `1.0`), as the parser requires; a
    rationale must hold a non-whitespace character (Python `str.isspace`) and no NUL.
paths:
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-sources:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the project's dataset source connections.
      operationId: listDatasetSourceConnections
      responses:
        '200':
          description: The project's dataset source connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSourceConnection'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
    post:
      summary: >-
        Create a new dataset source connection. `allowed_purposes` is this
        task's own real purpose-scoped grant, declared once at creation
        from the closed Section 6.8F vocabulary. A supplied `credential`/
        `connection_config` value is written for real to the real
        OpenBao-backed secret store before the row exists; only the
        resulting reference is ever persisted or returned.
      operationId: createDatasetSourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSourceConnectionCreateRequest'
      responses:
        '201':
          description: The created dataset source connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourceConnection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: project_id missing or belongs to a different organization -- identical.
        '503':
          description: >-
            A credential/connection_config value was supplied but no
            secret-manager backend is configured -- refused, never stored
            in plaintext.
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-sources/{connection_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one dataset source connection.
      operationId: getDatasetSourceConnection
      responses:
        '200':
          description: The dataset source connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourceConnection'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            Missing, belongs to a different organization, or belongs to a
            different project than the one named in the path -- identical
            in every case.
    patch:
      summary: >-
        Edit a non-revoked connection's display_name/allowed_purposes/
        security_classification (any non-empty subset). Re-granting
        allowed_purposes here is this task's own real re-authorization
        path -- there is no separate grant object.
      operationId: updateDatasetSourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSourceConnectionUpdateRequest'
      responses:
        '200':
          description: The updated dataset source connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourceConnection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing, wrong organization, or wrong project -- identical.
        '409':
          description: The connection is revoked and cannot be edited.
    delete:
      summary: Revoke (soft-delete) a dataset source connection. Idempotent.
      operationId: revokeDatasetSourceConnection
      responses:
        '200':
          description: >-
            The connection in its revoked state -- returned unchanged,
            with no new audit event, if it was already revoked. From this
            point on, authorize denies every purpose for this connection,
            including one it was previously granted for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourceConnection'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: Missing, wrong organization, or wrong project -- identical.
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-sources/{connection_id}/authorize:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        This task's own "authorization before import" acceptance clause
        made real and callable. A later Dataset-import task calls this
        exact real check before creating any Dataset from this
        connection. Never a silent 200 for a denied purpose.
      operationId: authorizeDatasetSourcePurpose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSourceAuthorizeRequest'
      responses:
        '200':
          description: The purpose is authorized for this connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourceAuthorizeResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: >-
            The connection is not active, or the requested purpose is not
            in its own allowed_purposes -- content-free reason only, never
            the connection's own secret material.
        '404':
          description: Missing, wrong organization, or wrong project -- identical.
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        List the project's dataset versions, ordered by id (FTF-0501-P1).
        A `held_out_evaluation` dataset is omitted for `ml_engineer`
        (Section 9/69.1).
      operationId: listDatasets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          required: false
          description: The `next_after` of the previous page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of dataset versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '400':
          description: '`invalid_limit` or `invalid_after`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found` -- project missing or in another organization.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one dataset version (FTF-0501-P1).
      operationId: getDataset
      responses:
        '200':
          description: The dataset version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            `not_found` -- identical for a missing id, another organization's
            id, another project's id, and a `held_out_evaluation` dataset read
            by `ml_engineer`.
  /api/v1/organizations/{organization_id}/projects/{project_id}/upload-sessions:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Open a direct-upload session (FTF-0501). Requires an active `upload`
        connection granting `purpose`; creates the multipart upload in private
        storage under a server-generated key. `ml_engineer` may not open a
        `held_out_evaluation` upload (403 `purpose_forbidden`).
      operationId: createUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionCreateRequest'
      responses:
        '201':
          description: The open session and its part layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionWithPlan'
        '400':
          description: '`invalid_body` or `unsupported_content_type`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized`, `purpose_forbidden` or `purpose_not_granted`.'
        '404':
          description: '`not_found` -- project or connection missing or foreign.'
        '409':
          description: '`not_an_upload_source`.'
        '413':
          description: '`request_too_large`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/upload-sessions/{upload_session_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: upload_session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read one upload session (never carries the object key).
      operationId: getUploadSession
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionWithPlan'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found` (identical for a missing, foreign or hidden id).'
  /api/v1/organizations/{organization_id}/projects/{project_id}/upload-sessions/{upload_session_id}/parts:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: upload_session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: The parts storage already holds, so an interrupted upload resumes.
      operationId: listUploadedParts
      responses:
        '200':
          description: Parts stored so far.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedParts'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
        '409':
          description: '`upload_session_not_open`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/upload-sessions/{upload_session_id}/part-urls:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: upload_session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Short-lived (<= 5 minutes, never past the session expiry) presigned
        PUT URLs for the requested parts. Each URL binds the method, the
        server-generated key, the part number, the multipart upload id and the
        exact part `content-length`. This is the only response that carries a
        storage URL.
      operationId: createPartUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUrlsRequest'
      responses:
        '200':
          description: One grant per requested part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrls'
        '400':
          description: '`invalid_body` or `invalid_part_numbers`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
        '409':
          description: '`upload_session_not_open`.'
        '410':
          description: '`upload_expired` -- the session is now `expired`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/upload-sessions/{upload_session_id}/finalize:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: upload_session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Complete the multipart upload and verify the stored object's size,
        server-computed SHA-256 and content-sniffed type against the session's
        declared values. Only a full match creates the immutable Dataset
        version. A mismatch deletes the object and rejects the session.
      operationId: finalizeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFinalizeRequest'
      responses:
        '201':
          description: The new Dataset version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          description: '`invalid_body`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
        '409':
          description: >-
            `upload_session_not_open`, `upload_incomplete` (parts missing; the
            session stays open) or `dataset_version_conflict`.
        '410':
          description: '`upload_expired` -- the session is now `expired`.'
        '422':
          description: >-
            Rejected; the session is now `rejected` and the object deleted.
            `detail` is one of `size_mismatch`, `sha256_mismatch`,
            `content_type_mismatch`, `unsupported_content_type`,
            `part_size_mismatch`, `unexpected_part`, `verification_mismatch`,
            `source_revoked`.
        '503':
          description: >-
            `storage_unavailable` or `storage_not_configured`; the session
            stays open (an outage is never reported as a rejection).
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/quality-report:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        The dataset's latest quality report (FTF-0516-P1): counts, the
        detectors that reported, whether it blocks split or training, and the
        residual-risk disclosure. A clean report is not proof the data has no
        personal data, secrets, poisoned or leaked records.
      operationId: getDatasetQualityReport
      responses:
        '200':
          description: The latest report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQualityReport'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            `not_found` (dataset missing, foreign, or held-out for
            `ml_engineer`) or `quality_report_not_found` (none recorded yet).
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/issues:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        Issues of the latest report, ordered by `issue_id` (FTF-0516-P1).
        Digests, positions, indices and codes only; never record content or a
        detector message.
      operationId: listDatasetQualityIssues
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          required: false
          description: The `next_after` of the previous page.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [blocking, warning]
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved, waived]
        - name: detector
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQualityIssuePage'
        '400':
          description: '`invalid_limit`, `invalid_after` or `invalid_filter`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found` or `quality_report_not_found`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/issues/{issue_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{64}$'
    get:
      summary: One issue of the latest report (FTF-0516-P1).
      operationId: getDatasetQualityIssue
      responses:
        '200':
          description: The issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQualityIssue'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            `not_found`, identical for a missing issue, another dataset's
            issue and a held-out dataset read by `ml_engineer`.
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/resolve-issue:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Decide 1..100 issues of the dataset's latest report in one
        all-or-nothing request (FTF-0516-P1). `exclude`, `correct` and
        `new_version` are open to ml_engineer; `waive` needs workspace_admin
        or organization_admin and only applies to a warning. The same
        `idempotency_key` with the same body replays the stored decisions
        (200) and writes nothing.
      operationId: resolveDatasetQualityIssues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIssueRequest'
      responses:
        '201':
          description: Decisions recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIssueResponse'
        '200':
          description: Replay of an earlier identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIssueResponse'
        '400':
          description: >-
            `invalid_body` (also a successor of another name or purpose, or a
            body with an unknown field) or `positions_not_in_issue`.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`waive_not_permitted` or a role that may not use this surface.'
        '404':
          description: >-
            `not_found` (dataset, issue or successor) or
            `quality_report_not_found`.
        '409':
          description: >-
            `report_version_conflict`, `report_superseded`,
            `issue_already_decided`, `waiver_not_allowed_for_blocking`,
            `detector_failure_requires_rerun`, `evidence_mismatch`,
            `successor_not_revalidated`, `successor_not_later_version` or
            `idempotency_key_reused`.
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/issue-resolutions:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        The dataset's most recent decisions across its reports, newest first
        (FTF-0516-P1).
      operationId: listDatasetIssueResolutions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetIssueResolutionPage'
        '400':
          description: '`invalid_limit`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-splits:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        List the project's split manifests (FTF-0519-P2), ordered by id. Each item is the
        manifest scalars, hashes and a finding-count leakage summary; never an assignment,
        record id or group id.
      operationId: listDatasetSplitManifests
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A page of manifests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSplitManifestPage'
        '400':
          description: '`invalid_limit` or `invalid_after`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-splits/{manifest_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >-
        One manifest with its four role rows (record and group counts and role hashes
        only), its sources with the frozen grants and quality report hashes, its status and
        its hashes. Never an assignment, record id, group id or storage key.
      operationId: getDatasetSplitManifest
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSplitManifestDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`, identical for a missing and a foreign manifest.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-splits/{manifest_id}/approve:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Lock a proposed manifest (FTF-0519-P2). The reviewer is the authenticated principal.
        Needs workspace_admin or organization_admin. The same request replays the stored
        outcome (200, `replayed: true`) and writes nothing. The Idempotency-Key is stored with a
        digest of the request (action, manifest, expected hash, reviews); the same key with
        another digest is 409 `idempotency_key_reused`.
      operationId: approveDatasetSplitManifest
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSplitManifestApproveRequest'
      responses:
        '200':
          description: Locked, or an identical earlier request replayed (the body says which in `replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSplitManifestOutcome'
        '400':
          description: >-
            `invalid_body`, `invalid_idempotency_key` or `invalid_review`.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` (including ml_engineer).'
        '404':
          description: '`not_found`.'
        '409':
          description: >-
            `manifest_changed`, `manifest_not_proposed`, `leakage_not_clear`,
            `manifest_insufficient`, `manifest_tampered` or `idempotency_key_reused` (the
            Idempotency-Key was already used by a request with another digest).
        '413':
          description: '`request_too_large`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/dataset-splits/{manifest_id}/reject:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: >-
        Reject a proposed manifest (FTF-0519-P2); the next proposal is a new version. Needs
        workspace_admin or organization_admin. The same request replays (200,
        `replayed: true`) and writes nothing. The Idempotency-Key is stored with a digest of the
        request; the same key with another digest is 409 `idempotency_key_reused`.
      operationId: rejectDatasetSplitManifest
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSplitManifestRejectRequest'
      responses:
        '200':
          description: Rejected, or an identical earlier request replayed (the body says which in `replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSplitManifestOutcome'
        '400':
          description: '`invalid_body` or `invalid_idempotency_key`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` (including ml_engineer).'
        '404':
          description: '`not_found`.'
        '409':
          description: >-
            `manifest_changed`, `manifest_not_proposed` or `idempotency_key_reused` (the
            Idempotency-Key was already used by a request with another digest).
        '413':
          description: '`request_too_large`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mapping-probe:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: >-
        Headers (tabular sources only) and up to twenty raw rows of the dataset, read with the
        caller's `csv` / `json` format options and a server-built probe mapping (FTF-H011-P3).
        Read-only. The audit event `dataset_mapping.probed` carries ids, a row count and the masked
        flag, never a value.
      operationId: probeDatasetMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetMappingProbeRequest'
      responses:
        '200':
          description: The probe verdict (`state` completed or failed) with its rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingProbe'
        '400':
          description: '`invalid_body`, `mapping_invalid` or `mapping_unsupported`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` or `purpose_not_authorized` (a revoked or narrowed grant).'
        '404':
          description: '`not_found`, identical for a missing, foreign and hidden held-out dataset.'
        '409':
          description: '`importer_unavailable` or `source_changed`.'
        '413':
          description: '`request_too_large`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mapping-preview:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: >-
        Previews a `DatasetMappingSpec` against the real dataset: each row raw beside canonical, the
        rejected rows with their codes, and the digest the approval is bound to (FTF-H011-P3).
        Read-only; the same grammar and critical checks as a proposal. The audit event
        `dataset_mapping.previewed` carries ids, counts and the masked flag, never a value.
      operationId: previewDatasetMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetMappingRequest'
      responses:
        '200':
          description: The preview verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingPreview'
        '400':
          description: >-
            `invalid_body`, `mapping_invalid`, `mapping_unsupported`, `critical_role_unmapped` or
            `tool_id_unmapped`.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` or `purpose_not_authorized`.'
        '404':
          description: '`not_found`.'
        '409':
          description: '`importer_unavailable` or `source_changed`.'
        '413':
          description: '`request_too_large`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mappings:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: >-
        The dataset's mapping versions, oldest first (FTF-H011-P3). `after` is the last
        `mapping_version` of the previous page.
      operationId: listDatasetMappings
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 999999999}}
      responses:
        '200':
          description: A page of mapping versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingPage'
        '400':
          description: '`invalid_limit` or `invalid_after`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: '`not_found`.'
    post:
      summary: >-
        Proposes the next mapping version (FTF-H011-P3): parses and checks the document, re-authorizes
        the dataset's connection for the dataset's own purpose and runs the real preview itself. An
        unchanged re-proposal returns the latest version and writes nothing. The same
        Idempotency-Key with the same digest replays the stored outcome (200, `replayed: true`); the
        same key with another digest is 409 `idempotency_key_reused`.
      operationId: proposeDatasetMapping
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetMappingRequest'
      responses:
        '200':
          description: An unchanged re-proposal, or an identical earlier request replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingOutcome'
        '201':
          description: A new mapping version in `proposed` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingOutcome'
        '400':
          description: >-
            `invalid_body`, `invalid_idempotency_key`, `mapping_invalid`, `mapping_unsupported`,
            `critical_role_unmapped` or `tool_id_unmapped`.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` or `purpose_not_authorized`.'
        '404':
          description: '`not_found`.'
        '409':
          description: >-
            `importer_unavailable`, `source_changed`, `preview_incomplete`, `mapping_conflict` or
            `idempotency_key_reused`.
        '413':
          description: '`request_too_large`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mappings/{mapping_id}:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: One mapping version of the dataset (FTF-H011-P3).
      operationId: getDatasetMapping
      responses:
        '200':
          description: The mapping version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMapping'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/RoleNotAuthorized'
        '404':
          description: >-
            `not_found`, identical for a missing id, a mapping of another dataset and a hidden
            dataset.
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mappings/{mapping_id}/approve:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: >-
        proposed -> approved (FTF-H011-P3). The approver is the authenticated principal; needs
        workspace_admin or organization_admin. The preview is re-run against the live bytes and must
        hash to `expected_preview_sha256`. The same Idempotency-Key with the same digest replays
        (200, `replayed: true`); the same key with another digest is 409 `idempotency_key_reused`.
      operationId: approveDatasetMapping
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetMappingApproveRequest'
      responses:
        '200':
          description: Approved, or an identical earlier request replayed (`replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingOutcome'
        '400':
          description: '`invalid_body`, `invalid_idempotency_key` or `invalid_request` (a purpose with surrounding whitespace).'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` (including ml_engineer) or `purpose_not_authorized`.'
        '404':
          description: '`not_found`.'
        '409':
          description: >-
            `purpose_mismatch`, `mapping_not_proposed`, `mapping_superseded`, `preview_changed`,
            `preview_incomplete`, `critical_rows_unmapped`, `ignored_keys_not_acknowledged`,
            `approval_refused`, `mapping_tampered`, `importer_unavailable`, `source_changed` or
            `idempotency_key_reused`.
        '413':
          description: '`request_too_large`.'
        '503':
          description: '`storage_unavailable` or `storage_not_configured`.'
  /api/v1/organizations/{organization_id}/projects/{project_id}/datasets/{dataset_id}/mappings/{mapping_id}/reject:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: mapping_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: >-
        proposed -> rejected (FTF-H011-P3); the next proposal is a new version. Needs workspace_admin
        or organization_admin. The same Idempotency-Key with the same digest replays (200,
        `replayed: true`); the same key with another digest is 409 `idempotency_key_reused`.
      operationId: rejectDatasetMapping
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetMappingRejectRequest'
      responses:
        '200':
          description: Rejected, or an identical earlier request replayed (`replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMappingOutcome'
        '400':
          description: '`invalid_body` or `invalid_idempotency_key`.'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          description: '`role_not_authorized` (including ml_engineer).'
        '404':
          description: '`not_found`.'
        '409':
          description: '`mapping_not_proposed` or `idempotency_key_reused`.'
        '413':
          description: '`request_too_large`.'
components:
  responses:
    NotAuthenticated:
      description: No authenticated session.
    RoleNotAuthorized:
      description: >-
        The authenticated principal's role in this organization does not
        permit this operation (Section 45: "ml_engineer: datasets/
        training" is the only sentence naming a role for this class of
        work; every operation, including reads, is gated to {ml_engineer,
        workspace_admin, organization_admin} -- this credential-bearing
        resource does not open reads wider than writes).
    ValidationFailed:
      description: The request body failed schema/policy validation.
  schemas:
    DatasetSourceType:
      type: string
      enum:
        [upload, s3, minio, database, agent_traces, production_conversations, api]
    DatasetSourcePurpose:
      type: string
      enum: [training, validation, held_out_evaluation, candidate_development, baseline_only]
    DatasetSourceSecurityClassification:
      type: string
      enum: [public, internal, confidential, restricted]
    DatasetSourceConnectionStatus:
      type: string
      enum: [active, revoked]
    DatasetSourceConnectionCreateRequest:
      type: object
      properties:
        source_type:
          $ref: '#/components/schemas/DatasetSourceType'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        allowed_purposes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetSourcePurpose'
          minItems: 1
        security_classification:
          $ref: '#/components/schemas/DatasetSourceSecurityClassification'
        credential:
          type: [string, 'null']
          description: >-
            A raw credential value, written for real to the secret
            backend and never persisted or echoed back as-is.
        connection_config:
          type: [object, 'null']
          description: >-
            Non-secret-but-sensitive connection configuration (e.g.
            bucket/region), stored the same way as credential.
      required: [source_type, display_name, allowed_purposes, security_classification]
      additionalProperties: false
    DatasetSourceConnectionUpdateRequest:
      type: object
      description: Any non-empty subset of the mutable fields. Refused (409) once revoked.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        allowed_purposes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetSourcePurpose'
          minItems: 1
        security_classification:
          $ref: '#/components/schemas/DatasetSourceSecurityClassification'
      additionalProperties: false
    DatasetSourceAuthorizeRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
      required: [purpose]
      additionalProperties: false
    DatasetSourceAuthorizeResponse:
      type: object
      properties:
        authorized:
          type: boolean
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
      required: [authorized, purpose]
      additionalProperties: false
    DatasetSourceConnection:
      type: object
      description: >-
        Section 6.8F -- the read-facing representation. Never includes
        credential_secret_ref/connection_config_encrypted_ref (Section 46:
        "Secret values never returned to browser after creation") --
        has_credential/has_connection_config disclose only whether each is
        set.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        source_type:
          $ref: '#/components/schemas/DatasetSourceType'
        display_name:
          type: string
        has_credential:
          type: boolean
        has_connection_config:
          type: boolean
        allowed_purposes:
          type: array
          items:
            $ref: '#/components/schemas/DatasetSourcePurpose'
        security_classification:
          $ref: '#/components/schemas/DatasetSourceSecurityClassification'
        connection_status:
          $ref: '#/components/schemas/DatasetSourceConnectionStatus'
        last_validated_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
      required:
        - id
        - organization_id
        - project_id
        - source_type
        - display_name
        - has_credential
        - has_connection_config
        - allowed_purposes
        - security_classification
        - connection_status
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    Dataset:
      type: object
      description: One immutable dataset version (Section 7A.10).
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        version: {type: integer, minimum: 1}
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
        upload_session_id: {type: string, format: uuid}
        verified_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        verified_size_bytes: {type: integer, minimum: 1}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
      required:
        - id
        - organization_id
        - project_id
        - name
        - version
        - purpose
        - upload_session_id
        - verified_sha256
        - verified_size_bytes
        - created_by
        - created_at
      additionalProperties: false
    DatasetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        next_after:
          type: [string, 'null']
          format: uuid
      required: [items, next_after]
      additionalProperties: false
    UploadSessionStatus:
      type: string
      enum: [open, verified, rejected, expired]
    UploadSessionCreateRequest:
      type: object
      description: >-
        Frozen for FTF-0501 (no path yet). The source connection must be an
        active `upload` connection granting `purpose`.
      properties:
        dataset_source_connection_id: {type: string, format: uuid}
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
        declared_size_bytes: {type: integer, minimum: 1, maximum: 10737418240}
        declared_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        declared_content_type: {type: string, minLength: 1, maxLength: 255}
        declared_encoding:
          type: string
          enum: [utf-8, utf-8-sig, utf-16-le, utf-16-be, windows-1256]
          default: utf-8
          description: >-
            FTF-0501-F2. The text encoding finalize decodes the whole object with,
            strictly. Optional (default `utf-8`); not allowed with the spreadsheet type
            unless `utf-8`.
      required:
        - dataset_source_connection_id
        - purpose
        - declared_size_bytes
        - declared_sha256
        - declared_content_type
      additionalProperties: false
    UploadSession:
      type: object
      description: Frozen for FTF-0501 (no path yet). Never carries the object key.
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        dataset_source_connection_id: {type: string, format: uuid}
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
        status:
          $ref: '#/components/schemas/UploadSessionStatus'
        declared_size_bytes: {type: integer, minimum: 1}
        declared_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        declared_content_type: {type: string}
        declared_encoding:
          type: string
          enum: [utf-8, utf-8-sig, utf-16-le, utf-16-be, windows-1256]
        rejection_reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        finalized_at: {type: [string, 'null'], format: date-time}
      required:
        - id
        - project_id
        - dataset_source_connection_id
        - purpose
        - status
        - declared_size_bytes
        - declared_sha256
        - declared_content_type
        - declared_encoding
        - rejection_reason
        - created_at
        - expires_at
        - finalized_at
      additionalProperties: false
    UploadFinalizeRequest:
      type: object
      description: Frozen for FTF-0501 (no path yet).
      properties:
        dataset_name: {type: string, minLength: 1, maxLength: 200}
      required: [dataset_name]
      additionalProperties: false
    UploadSessionWithPlan:
      type: object
      description: >-
        An `UploadSession` plus the deterministic part layout: every part but
        the last is `part_size_bytes`; the last holds the remainder. Never
        carries the object key.
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        dataset_source_connection_id: {type: string, format: uuid}
        purpose:
          $ref: '#/components/schemas/DatasetSourcePurpose'
        status:
          $ref: '#/components/schemas/UploadSessionStatus'
        declared_size_bytes: {type: integer, minimum: 1}
        declared_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        declared_content_type: {type: string}
        declared_encoding:
          type: string
          enum: [utf-8, utf-8-sig, utf-16-le, utf-16-be, windows-1256]
        rejection_reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        finalized_at: {type: [string, 'null'], format: date-time}
        part_size_bytes: {type: integer, minimum: 5242880}
        part_count: {type: integer, minimum: 1, maximum: 10000}
      required:
        - id
        - project_id
        - dataset_source_connection_id
        - purpose
        - status
        - declared_size_bytes
        - declared_sha256
        - declared_content_type
        - declared_encoding
        - rejection_reason
        - created_at
        - expires_at
        - finalized_at
        - part_size_bytes
        - part_count
      additionalProperties: false
    UploadedParts:
      type: object
      properties:
        part_size_bytes: {type: integer, minimum: 5242880}
        part_count: {type: integer, minimum: 1, maximum: 10000}
        parts:
          type: array
          items:
            type: object
            properties:
              part_number: {type: integer, minimum: 1, maximum: 10000}
              size_bytes: {type: integer, minimum: 1}
            required: [part_number, size_bytes]
            additionalProperties: false
      required: [part_size_bytes, part_count, parts]
      additionalProperties: false
    PartUrlsRequest:
      type: object
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 10000}
      required: [part_numbers]
      additionalProperties: false
    PartUrls:
      type: object
      properties:
        parts:
          type: array
          items:
            type: object
            properties:
              part_number: {type: integer, minimum: 1, maximum: 10000}
              method: {type: string, enum: [PUT]}
              url: {type: string}
              content_length: {type: integer, minimum: 1}
              expires_at: {type: string, format: date-time}
            required: [part_number, method, url, content_length, expires_at]
            additionalProperties: false
      required: [parts]
      additionalProperties: false
    Sha256Hex:
      type: string
