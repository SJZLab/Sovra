      additionalProperties: false
    DatasetMappingName:
      type: string
      minLength: 1
      maxLength: 256
    DatasetMappingPointer:
      type: string
      maxLength: 256
      pattern: '^$|^(?:/(?!-(?:/|$))(?!0[0-9]+(?:/|$))(?![0-9]{10,}(?:/|$))(?:[^/~]|~[01])+){1,16}$'
    DatasetMappingSlot:
      oneOf:
