        consent: {$ref: '#/components/schemas/DatasetMappingSlot'}
        quality_label: {$ref: '#/components/schemas/DatasetMappingSlot'}
        source_record_id: {$ref: '#/components/schemas/DatasetMappingSlot'}
        event_timestamp: {$ref: '#/components/schemas/DatasetMappingSlot'}
      additionalProperties: false
    DatasetMappingSpec:
