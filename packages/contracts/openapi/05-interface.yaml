        - type: object
          properties: {header: {$ref: '#/components/schemas/DatasetMappingName'}}
          required: [header]
          additionalProperties: false
        - type: object
          properties: {index: {type: integer, minimum: 0, maximum: 16383}}
          required: [index]
          additionalProperties: false
        - type: object
          properties:
            letters: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Z]{1,3}$'}
          required: [letters]
          additionalProperties: false
    DatasetMappingRoleMap:
