            tool_calls_key: {$ref: '#/components/schemas/DatasetMappingName'}
            tool_call_id_key: {$ref: '#/components/schemas/DatasetMappingName'}
            name_key: {$ref: '#/components/schemas/DatasetMappingName'}
            group_key: {$ref: '#/components/schemas/DatasetMappingSlot'}
            metadata: {$ref: '#/components/schemas/DatasetMappingMetadata'}
            csv: {$ref: '#/components/schemas/DatasetMappingCsvOptions'}
            xlsx: {$ref: '#/components/schemas/DatasetMappingXlsxOptions'}
            json: {$ref: '#/components/schemas/DatasetMappingJsonOptions'}
          required:
            [shape, messages_pointer, role_key, content_key, role_map, on_unmapped_message_keys]
          additionalProperties: false
        - type: object
          properties:
            shape: {const: messages_json}
            messages: {$ref: '#/components/schemas/DatasetMappingSlot'}
            role_key: {$ref: '#/components/schemas/DatasetMappingName'}
            content_key: {$ref: '#/components/schemas/DatasetMappingName'}
            role_map: {$ref: '#/components/schemas/DatasetMappingRoleMap'}
            on_unmapped_message_keys: {type: string, enum: [reject, ignore]}
            tool_calls_key: {$ref: '#/components/schemas/DatasetMappingName'}
            tool_call_id_key: {$ref: '#/components/schemas/DatasetMappingName'}
            name_key: {$ref: '#/components/schemas/DatasetMappingName'}
            group_key: {$ref: '#/components/schemas/DatasetMappingSlot'}
            metadata: {$ref: '#/components/schemas/DatasetMappingMetadata'}
            csv: {$ref: '#/components/schemas/DatasetMappingCsvOptions'}
            xlsx: {$ref: '#/components/schemas/DatasetMappingXlsxOptions'}
            json: {$ref: '#/components/schemas/DatasetMappingJsonOptions'}
          required: [shape, messages, role_key, content_key, role_map, on_unmapped_message_keys]
          additionalProperties: false
        - type: object
          properties:
            shape: {const: prompt_completion}
            prompt: {$ref: '#/components/schemas/DatasetMappingSlot'}
            completion: {$ref: '#/components/schemas/DatasetMappingSlot'}
            system: {$ref: '#/components/schemas/DatasetMappingSlot'}
            group_key: {$ref: '#/components/schemas/DatasetMappingSlot'}
            metadata: {$ref: '#/components/schemas/DatasetMappingMetadata'}
            csv: {$ref: '#/components/schemas/DatasetMappingCsvOptions'}
            xlsx: {$ref: '#/components/schemas/DatasetMappingXlsxOptions'}
            json: {$ref: '#/components/schemas/DatasetMappingJsonOptions'}
          required: [shape, prompt, completion]
          additionalProperties: false
    DatasetMappingRequest:
      type: object
      properties:
        mapping: {$ref: '#/components/schemas/DatasetMappingSpec'}
      required: [mapping]
      additionalProperties: false
    DatasetMappingProbeRequest:
      type: object
      properties:
        csv: {$ref: '#/components/schemas/DatasetMappingCsvOptions'}
        json: {$ref: '#/components/schemas/DatasetMappingJsonOptions'}
      additionalProperties: false
    DatasetMappingApproveRequest:
      type: object
      properties:
        expected_preview_sha256: {$ref: '#/components/schemas/Sha256Hex'}
        purpose: {type: string, minLength: 1, maxLength: 32}
        acknowledged_ignored_keys:
          type: array
          maxItems: 200
          items: {type: string, minLength: 1, maxLength: 200}
        rationale: {type: string, minLength: 1, maxLength: 2000, pattern: '^(?=[\s\S]*\S)[^\x00]*$'}
      required: [expected_preview_sha256, purpose, acknowledged_ignored_keys, rationale]
      additionalProperties: false
    DatasetMappingRejectRequest:
