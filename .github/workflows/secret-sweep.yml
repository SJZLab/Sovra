name: Secret sweep (all refs)
# FTF-1505 point 8 (Control-plane ruling 2026-10-15T08:43Z): the PR-blocking history lane in
# ci.yml `secret-scanning` scans only blobs reachable from the checked-out head (`--scope pr`),
# so an unmerged branch can never redden an unrelated PR. This workflow is the other half of
# that ruling: on every push to main, on a schedule, and on demand, it scans every blob on
# every ref (`--scope all-refs`) and reports each finding with the branch that carries it.
# A finding fails this run (visible on main), never any PR. Not part of ci-verdict.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' && git fetch --tags origin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: Install Python dependencies
        run: uv sync --all-packages
      - name: Secret scan, every ref (branch-attributed)
        run: uv run python3 tests/security/secret_scanning.py --scope all-refs
