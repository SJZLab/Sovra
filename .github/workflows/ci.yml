  postgres-backup-integration:
    # FTF-1601: real pg_dump/openssl/pg_restore encrypted-backup-and-
    # restoration evidence (Section 48/71.2) --
    # tests/integration/test_postgres_backup.py. Same real
    # `services: postgres` container pattern as
    # organization-workspace-schema-integration/audit-event-writer-
    # integration (this repo's interactive dev sandbox has no
    # container-registry egress; that evidence was instead produced
    # locally against a directly-installed PostgreSQL 16 -- see this
    # task's docs/certifications/queue.md entry). Unlike those two jobs,
    # this one shells out to the `pg_dump`/`pg_restore`/`psql` client
    # binaries directly, so the runner (not just the service container)
    # needs a matching Postgres client installed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571 # postgres:16-alpine (amd64) -- same digest FTF-0004/FTF-0102/FTF-0104 already pinned
