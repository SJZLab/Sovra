    # revoked connection, a session with no tenant context ever bound
    # refused via TenantContextError, and the restricted sovra_app role's
    # own grant surface (no DELETE privilege -- revoke is a soft state
    # transition only), running through the restricted sovra_app role,
    # never the migration owner --
    # tests/integration/test_ftf_0201_litellm_connection_crud.py. Same
