      - name: Install Python dependencies (apps/api workspace member)
        run: uv sync --all-packages
      - name: Install Postgres client (pg_dump/pg_restore/psql matching the service's major version)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client-16
      - name: Prove the real encrypted-backup/restoration evidence against the live database
        run: uv run python3 tests/integration/test_postgres_backup.py

