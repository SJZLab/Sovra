name: CI
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FTF-H001's validate_spec.py resolves every certified task's
          # evidence commit via `git cat-file -e` — actions/checkout's
          # default shallow clone (depth 1) only fetches the tip commit,
          # so every older evidence commit would spuriously read as
          # stale_commit. Full history is required for that check to mean
          # anything.
          fetch-depth: 0
      - name: Verify CLAUDE.md.sha256
        run: |
          if [ ! -f CLAUDE.md ]; then
            echo "CLAUDE.md not found — nothing to verify."
            exit 0
          fi
          if [ ! -f CLAUDE.md.sha256 ]; then
            echo "CLAUDE.md exists but CLAUDE.md.sha256 is missing."
            echo "Generate it and commit it alongside CLAUDE.md:"
            echo "  sha256sum CLAUDE.md | awk '{print \$1}' > CLAUDE.md.sha256"
            exit 1
          fi
          expected=$(sha256sum CLAUDE.md | awk '{print $1}')
          actual=$(tr -d '[:space:]' < CLAUDE.md.sha256)
          if [ "$expected" != "$actual" ]; then
            echo "CLAUDE.md.sha256 is stale."
            echo "  CLAUDE.md.sha256 contains: $actual"
            echo "  sha256sum CLAUDE.md gives: $expected"
            echo "Regenerate and commit it in the SAME commit as the CLAUDE.md change:"
            echo "  sha256sum CLAUDE.md | awk '{print \$1}' > CLAUDE.md.sha256"
            exit 1
          fi
          echo "CLAUDE.md.sha256 verified: $actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate deps
        run: pip install pyyaml --quiet
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Python dev dependencies
        # --all-packages: a bare `uv sync` only installs the root workspace
        # package + dev group, not each member's own `dependencies` (FTF-0102
        # confirmed this empirically -- it silently uninstalled apps/api's
        # freshly-added sqlalchemy/alembic/psycopg). Every prior task's
        # apps/api had `dependencies = []`, so this never mattered before.
        run: uv sync --all-packages
      - name: Install JS/TS dev dependencies
        run: pnpm install --frozen-lockfile
      - name: Python lint + format + type check (FTF-0002)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
      - name: TypeScript lint + format + type check (FTF-0002)
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck
      - name: FTF-0002 negative-test proof (checks catch real defects)
        run: python3 tests/tasks/test_ftf_0002.py
      - name: Python unit tests (FTF-0003)
        run: uv run pytest tests/unit --junitxml=reports/pytest-junit.xml -ra
      - name: TypeScript unit tests (FTF-0003)
        run: pnpm exec vitest run --reporter=junit --outputFile=reports/vitest-junit.xml
      - name: FTF-0003 negative-acceptance gate (zero-tests / skipped / focused)
        run: python3 scripts/check_test_harness.py --junit reports/pytest-junit.xml --junit reports/vitest-junit.xml
      - name: FTF-0003 negative-test proof (harness catches real defects)
        run: python3 tests/tasks/test_ftf_0003.py
      - name: FTF-0005 negative-test proof (configuration system catches real defects)
        run: python3 tests/tasks/test_ftf_0005.py
      - name: FTF-0004 negative-test proof (readiness checks catch real defects)
        run: python3 tests/tasks/test_ftf_0004.py
      - name: FTF-0006 negative-test proof (observability foundation catches real defects)
        run: python3 tests/tasks/test_ftf_0006.py
      - name: FTF-H001 executable specification validator
        run: python3 scripts/validate_spec.py --strict
      - name: FTF-H001 negative-test proof (gate bootstrap catches real defects)
        run: python3 tests/tasks/test_ftf_h001.py
      - name: FTF-R001 negative-test proof (reuse architecture/version-lock schemas catch real defects)
        run: python3 tests/tasks/test_ftf_r001.py
      - name: FTF-H002 release-scope lock validation
        run: python3 scripts/release_scope_lock.py
      - name: FTF-H002 negative-test proof (release scope/compatibility/preflight catch real defects)
        run: python3 tests/tasks/test_ftf_h002.py
      - name: FTF-H028 negative-test proof (release evidence gate catches real defects)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/tasks/test_ftf_h028.py
      - name: FTF-H034 negative-test proof (safe parallel scheduler catches real defects)
        run: python3 tests/tasks/test_ftf_h034.py
      - name: FTF-1810 negative-test proof (release qualification workflow catches real defects)
        run: python3 tests/tasks/test_ftf_1810.py
      - name: FTF-R014 negative-test proof (executor binding catches real defects)
        run: python3 tests/implementation/test_r1_execution_binding.py
      - name: FTF-R015 negative-test proof (isolated concurrent execution catches real defects)
        run: python3 tests/implementation/test_safe_parallel_executor.py
      - name: FTF-R011 deployment-profile assertion-level release matrix validation
        run: python3 scripts/validate_profile_scope.py
      - name: FTF-R011 negative-test proof (connected/air-gap release matrix catches real defects)
        run: python3 tests/security/test_profile_scope.py
      - name: FTF-R017 component-maintenance/OSS-lifecycle validation
        run: python3 scripts/validate_component_maintenance.py
      - name: FTF-R017 storage-profile validation
        run: python3 scripts/validate_storage_profile.py
      - name: FTF-R017 negative-test proof (storage/OSS-lifecycle qualification catches real defects)
        run: python3 tests/tasks/test_ftf_r017.py
      - name: FTF-0102 negative-test proof (organization/workspace schema catches real defects, no DB required)
        # uv run, not bare python3: this is the first task with a real,
        # owner-approved third-party runtime dependency (sqlalchemy) --
        # every prior tests/tasks/test_ftf_*.py needed only the stdlib.
        run: uv run python3 tests/tasks/test_ftf_0102.py
      - name: FTF-0104 negative-test proof (audit event writer catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0104.py
      - name: FTF-1601 negative-test proof (postgres backup catches real defects, no DB required)
        run: python3 tests/tasks/test_ftf_1601.py
      - name: FTF-0101 negative-test proof (OIDC login catches real defects, real local sockets, no DB required)
        # uv run: this is the first task requiring FastAPI/authlib/itsdangerous/uvicorn
        # (owner-approved 2026-09-19), the same reason FTF-0102 first needed `uv run`.
        run: uv run python3 tests/tasks/test_ftf_0101.py
      - name: FTF-0103 negative-test proof (RBAC middleware catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0103.py
      - name: FTF-0105 negative-test proof (tenant-isolation query guards catch real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0105.py
      - name: FTF-H003 negative-test proof (cross-layer tenant isolation catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_h003.py
      - name: FTF-0106 negative-test proof (RBAC/IDOR full role-matrix security tests catch real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0106.py
      - name: FTF-0201 negative-test proof (LiteLLM connection CRUD catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0201.py
      - name: FTF-0301 negative-test proof (TrainableArtifact schema/API catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0301.py
      - name: FTF-0401 negative-test proof (Project schema/API/UI catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0401.py
      - name: FTF-0402 negative-test proof (Project security profile catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0402.py
      - name: FTF-0305 negative-test proof (License acceptance workflow catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0305.py
      - name: FTF-0404 negative-test proof (Tool schema CRUD catches real defects, real local sockets, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0404.py
      - name: FTF-0405 negative-test proof (JSON Schema tool validation catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0405.py
      - name: FTF-0406 negative-test proof (Side-effect classification catches real defects, no DB required)
        # Gate-wiring gap closed opportunistically: FTF-0406 was CERTIFIED
        # (PR #153) without this step ever being added here, so CI never
        # actually re-ran its own suite on later PRs -- noticed while this
        # task (FTF-0403) was already touching this same file for its own
        # new integration job, fixed alongside it rather than left silently.
        run: uv run python3 tests/tasks/test_ftf_0406.py
      - name: FTF-0407 negative-test proof (Critical behavior requirements catches real defects, no DB required)
        # Same disclosed gate-wiring gap as FTF-0406 immediately above (PR #156).
        run: uv run python3 tests/tasks/test_ftf_0407.py
      - name: FTF-0403 negative-test proof (Budget policy catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_0403.py
      - name: FTF-1701 negative-test proof (Reference agent specification catches real defects, no DB required)
        run: uv run python3 tests/reference/test_ftf_1701.py
      - name: FTF-1301 negative-test proof (CostProfile catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_1301.py
      - name: FTF-1302 negative-test proof (Local compute costing catches real defects, no DB required)
        run: uv run python3 tests/tasks/test_ftf_1302.py
      - name: Product-truth check
        run: python3 scripts/product_truth_check.py --fail-on-unwired
      - name: Status tool
        run: python3 scripts/status.py
      # Knowledge graph ingestion — commented out until M0 closes (N/A for fresh
      # repo, but left disabled until FTF-0001 lands so there is something to ingest).
      # - name: Update knowledge graph
      #   run: |
      #     pip install cognee --quiet
      #     cognee-cli remember .

  docker-local-stack-integration:
    # FTF-0004: real Postgres/Temporal/SeaweedFS (S3-compatible) integration
    # + negative-acceptance (restart/persistence) evidence. Runs on GitHub
    # Actions' hosted runner because it has real container-registry egress;
    # this repo's interactive dev sandbox does not (Docker Hub's CDN is
    # blocked by that session's egress policy — see
    # docs/certifications/queue.md for FTF-0004's full repro).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the real local stack and prove restart/persistence
        run: python3 scripts/verify_docker_local_stack.py

  organization-workspace-schema-integration:
    # FTF-0102: real Postgres migration + FORCE ROW LEVEL SECURITY
    # tenant-isolation evidence for Organization/Workspace (Section
    # 6.1/6.2, 65.1) -- tests/integration/test_organization_workspace_schema.py.
    # Uses GitHub Actions' own `services: postgres` container (real
    # registry egress on the hosted runner; this repo's interactive dev
    # sandbox does not have it -- confirmed again this task with a real
    # `docker pull postgres:16-alpine`, same reproducible 403 FTF-0004's
    # own evidence already documents. That evidence was instead produced
    # locally against a directly-installed PostgreSQL 16 -- see this
    # task's docs/certifications/queue.md entry).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571 # postgres:16-alpine (amd64) -- same digest FTF-0004 already pinned
        env:
          POSTGRES_USER: sovra_migrate
          POSTGRES_PASSWORD: sovra_migrate_ci_only
          POSTGRES_DB: sovra_ftf0102
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovra_migrate -d sovra_ftf0102"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOVRA_DATABASE_URL: postgresql+psycopg://sovra_migrate:sovra_migrate_ci_only@localhost:5432/sovra_ftf0102
      SOVRA_APP_DB_PASSWORD: sovra_app_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Python dependencies (apps/api workspace member)
        run: uv sync --all-packages
      - name: Prove the real migration + RLS tenant-isolation evidence against the live database
        run: uv run python3 tests/integration/test_organization_workspace_schema.py

