  mutation-gate:
    # Law 1 made mechanical for relay submissions: every production function a
    # `[relay]` PR changes (under product_truth_check.SOURCE_ROOTS) is broken one
    # small way at a time (scripts/mutation_gate.py, operators M1-M10) and the PR's
    # own tests/tasks tests are re-run; any mutant they leave GREEN fails this job
    # and is listed, so the relay sees every surviving mutant before L2 review
    # instead of one returned round at a time. Unit tests only for now: no
    # services, so only tests/tasks/test_*.py (all no-DB by convention) are used.
    # Reviewed equivalent mutants: docs/certifications/mutation-allowlist.yaml.
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[relay]')
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: Install Python dependencies
        run: uv sync --all-packages
      - name: Relay PRs may not edit the mutation allowlist (Control-plane file)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'docs/certifications/mutation-allowlist.yaml'; then
            echo "::error::A [relay] PR changed docs/certifications/mutation-allowlist.yaml. Only the Control plane adds reviewed equivalent mutants; kill the mutant with a test instead."
            exit 1
          fi
      - name: Select the PR's task tests
        id: select
        env:
          # Untrusted PR text goes through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          base = "origin/" + os.environ["BASE_REF"]
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout
          changed = git("diff", "--name-only", "--diff-filter=AMR", f"{base}...HEAD", "--", "tests/tasks/", "tests/reference/").split()
          tests = sorted({f for f in changed if re.fullmatch(r"tests/(tasks|reference)/test_[^/]+\.py", f)
                          and f != "tests/tasks/test_mutation_gate.py"})
          if not tests:
              print("No tests/tasks/test_*.py changed; deriving task IDs instead.")
              text = os.environ.get("PR_TITLE", "") + "\n" + os.environ.get("HEAD_REF", "")
              ids = re.findall(r"FTF-[0-9A-Z]+", text, flags=re.I)
              if not ids:
                  added = git("diff", "-U0", f"{base}...HEAD", "--", "apps/web", "apps/api", "workers", "packages", "evals")
                  ids = re.findall(r"FTF-[0-9A-Z]+", "\n".join(l for l in added.splitlines() if l.startswith("+")), flags=re.I)
              found = set()
              for i in {x.lower().removeprefix("ftf-") for x in ids}:
                  exact = pathlib.Path(f"tests/tasks/test_ftf_{i}.py")
                  if exact.is_file():
                      found.add(str(exact))
                  found.update(str(p) for p in pathlib.Path("tests/tasks").glob(f"test_ftf_{i}_*.py"))
                  ref = pathlib.Path(f"tests/reference/test_ftf_{i}.py")
                  if ref.is_file():
                      found.add(str(ref))
              tests = sorted(found)
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          lst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mutation-tests.txt"
          if not tests:
              # A skip is only legitimate when there is nothing to mutate. Production Python
              # changed with no task test to run the mutants against is a missing test, not a pass.
              import sys
              sys.path.insert(0, ".")
              from scripts.mutation_gate import is_test_path, under_source_roots
              prod = [f for f in git("diff", "--name-only", "--diff-filter=AMR", f"{base}...HEAD").split()
                      if f.endswith(".py") and under_source_roots(f) and not is_test_path(f)]
              if prod:
                  print("::error::mutation-gate: production Python changed but this PR has no tests/tasks/test_*.py or tests/reference/test_*.py "
                        "(changed, or tests/tasks/test_ftf_<id>.py for its task ID) to kill mutants with: "
                        + ", ".join(prod) + ". Add the task test that exercises this code.")
                  raise SystemExit(1)
              print("mutation-gate: SKIPPED -- no production Python changed and no task tests; nothing to mutate.")
              with out.open("a") as fh:
                  fh.write("skip=true\n")
          else:
              lst.write_text("\n".join(tests) + "\n")
              print("Tests the mutants must be killed by:\n" + "\n".join(tests))
              with out.open("a") as fh:
                  fh.write(f"skip=false\nlist={lst}\n")
          PY
      - name: Mutation gate (every surviving mutant fails the job)
        if: steps.select.outputs.skip == 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
          TEST_LIST: ${{ steps.select.outputs.list }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            args+=(--test "uv run python3 $t")
          done < "$TEST_LIST"
          mkdir -p reports
          uv run python3 scripts/mutation_gate.py --base "origin/${BASE_REF}" "${args[@]}" \
            --timeout 300 --max-mutants 200 --json reports/mutation-gate.json
      - name: Upload mutation report
        if: always() && steps.select.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-gate-report
          path: reports/mutation-gate.json
          if-no-files-found: ignore

