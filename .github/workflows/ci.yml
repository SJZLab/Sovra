  ci-verdict:
    # THE result to read for "CI is green" (merge-on-green, certification, Control plane).
    # Fails on any failed or cancelled job, on any skipped job without a documented exemption
    # (scripts/ci_policy.py skip_exemption: *-integration on a tracker-only change set;
    # mutation-gate/relay-policy on non-[relay] PRs), and on any job missing from `needs`
    # below (tests/unit/test_ci_policy.py also fails the gate if a job is left out). Writes an
    # evidence record bound to merge candidate, head, base, workflow hash, change-set hash,
    # runner image and every job result. Base-branch copy of the policy script.
    # !cancelled(): runs after failed/skipped/timed-out jobs (a job timeout is judged here as
    # a non-pass), but not in a run superseded by the concurrency group -- that run has no
    # verdict at all, so it can never be read as a pass.
    if: ${{ !cancelled() }}
    needs:
      - classify
      - relay-policy
      - gate
      - mutation-gate
      - docker-local-stack-integration
      - organization-workspace-schema-integration
      - audit-event-writer-integration
      - tenant-isolation-query-guards-integration
      - ftf-h003-cross-layer-isolation-integration
      - rbac-idor-security-integration
      - litellm-connection-crud-integration
      - litellm-access-guard-integration
      - model-catalog-integration
      - trainable-artifact-schema-api-integration
      - project-schema-api-integration
      - project-security-profile-integration
      - postgres-backup-integration
      - storage-semantics-integration
      - s3-minio-versioned-source-integration
      - direct-upload-s3-integration
      - direct-upload-routes-integration
      - resumable-upload-ui-real-api-integration
      - dataset-quality-ui-real-api-integration
      - oidc-provider-integration
      - license-acceptance-workflow-integration
      - artifact-transition-race-integration
      - tool-schema-crud-integration
      - critical-behavior-requirements-integration
      - budget-policy-integration
      - cost-profile-integration
      - secret-manager-integration
      - tenant-isolation-suite-integration
      - model-version-schema-api-integration
      - api-load-test-integration
      - dataset-source-connection-integration
      - target-application-connection-integration
      - target-source-snapshot-integration
      - github-repository-listing-integration
      - github-branch-ref-integration
      - github-source-snapshot-integration
      - component-bindings-integration
      - connection-validation-integration
      - model-discovery-integration
      - litellm-registration-capability-integration
      - dependency-scanning-integration
      - discovered-agent-candidate-integration
      - agent-manifest-integration
      - manifest-evidence-integration
      - base-model-revision-digest-resolver-integration
      - database-api-trace-source-integration
      - evaluation-suite-integration
      - organization-gateway-policy-integration
      - external-provider-denial-integration
      - model-catalog-mapping-integration
      - model-capabilities-integration
      - capability-contract-integration
      - evaluation-case-integration
      - dataset-upload-integration
      - dataset-upload-hardening-integration
      - dataset-quality-issues-integration
      - live-auth-path-integration
      - network-policy-enforcement-integration
      - object-storage-backup-integration
      - mlflow-projection-integration
      - mlflow-durable-outbox-integration
      - model-import-integration
      - candidate-selection-integration
      - dataset-import-source-integration
      - csv-import-integration
      - jsonl-import-integration
      - json-import-integration
      - xlsx-import-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use the base branch's policy script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:scripts/ci_policy.py" > "$RUNNER_TEMP/ci_policy.py" 2>/dev/null; then
            echo "::warning::base has no scripts/ci_policy.py yet (bootstrap PR); using this PR's copy"
            cp scripts/ci_policy.py "$RUNNER_TEMP/ci_policy.py"
          fi
      - name: Verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          SCOPE_REASON: ${{ needs.classify.outputs.reason }}
          FILES_SHA256: ${{ needs.classify.outputs.files_sha256 }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"
          python3 "$RUNNER_TEMP/ci_policy.py" verdict --needs-json "$RUNNER_TEMP/needs.json" \
            --workflow .github/workflows/ci.yml --scope "$SCOPE" --scope-reason "$SCOPE_REASON" \
            --files-sha256 "$FILES_SHA256" --title "$PR_TITLE" --number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" --evidence reports/ci-verdict.json
      - name: Upload verdict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-verdict-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: reports/ci-verdict.json
          if-no-files-found: error
