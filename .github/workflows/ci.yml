name: CI
on: [pull_request]
# One live verification per PR. A newer event on the same PR (new head, or the same head
# re-delivered) supersedes the older run: its inputs (head, base/merge candidate, workflow)
# are the current ones, so the older run is cancelled instead of finishing a stale answer.
# Keyed by PR number, never by SHA: two PRs with the same head but different bases are
# different merge candidates and keep separate runs. A superseded (cancelled) run gets no
# ci-verdict at all, so it can never read as a pass; only the newest run's verdict counts.
# Scope: this workflow only. Release/smoke workflows and Railway deploys are untouched.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    # Decides the verification scope from the PR's own change set (scripts/ci_policy.py,
    # run from the BASE branch copy so the PR cannot rewrite its own scope rule). "tracker"
    # = only tracker/record files changed (QUEUE.md, PROGRESS.md, docs/certifications/**,
    # docs/progress/**, spec-matrix/tracker mirrors): the gate job still runs every check;
    # only the service-backed *-integration jobs are skipped, because no integration test
    # reads those files. Any other file, any doubt, any error = "full".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      reason: ${{ steps.classify.outputs.reason }}
      files_sha256: ${{ steps.classify.outputs.files_sha256 }}
      focus: ${{ steps.classify.outputs.focus }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use the base branch's policy script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:scripts/ci_policy.py" > "$RUNNER_TEMP/ci_policy.py" 2>/dev/null; then
            echo "::warning::base has no scripts/ci_policy.py yet (bootstrap PR); using this PR's copy"
            cp scripts/ci_policy.py "$RUNNER_TEMP/ci_policy.py"
          fi
      - name: Classify the change set
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          # Untrusted PR text goes through env, never interpolated into the script. It can only
          # narrow a run to "focused", which ci-verdict always fails.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$RUNNER_TEMP/ci_policy.py" classify --base "origin/${BASE_REF}" --event "$EVENT" --workflow .github/workflows/ci.yml

  relay-policy:
    # [relay] PRs only: one open PR per item (the oldest open PR owns it), no edits to
    # Control-plane/governance files, no CERTIFIED flips, no log-only PRs. Base-branch copy.
    if: startsWith(github.event.pull_request.title, '[relay]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use the base branch's policy script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:scripts/ci_policy.py" > "$RUNNER_TEMP/ci_policy.py" 2>/dev/null; then
            echo "::warning::base has no scripts/ci_policy.py yet (bootstrap PR); using this PR's copy"
            cp scripts/ci_policy.py "$RUNNER_TEMP/ci_policy.py"
          fi
      - name: Relay policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          # Untrusted PR text goes through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/ci_policy.py" relay-policy --base "origin/${BASE_REF}" --title "$PR_TITLE" --number "$PR_NUMBER" --repo "$REPO"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # FTF-H001's validate_spec.py resolves every certified task's
          # evidence commit via `git cat-file -e` — actions/checkout's
          # default shallow clone (depth 1) only fetches the tip commit,
          # so every older evidence commit would spuriously read as
          # stale_commit. Full history is required for that check to mean
          # anything.
          fetch-depth: 0
      - name: Verify CLAUDE.md.sha256
        run: |
          if [ ! -f CLAUDE.md ]; then
            echo "CLAUDE.md not found — nothing to verify."
            exit 0
          fi
          if [ ! -f CLAUDE.md.sha256 ]; then
            echo "CLAUDE.md exists but CLAUDE.md.sha256 is missing."
            echo "Generate it and commit it alongside CLAUDE.md:"
            echo "  sha256sum CLAUDE.md | awk '{print \$1}' > CLAUDE.md.sha256"
            exit 1
          fi
          expected=$(sha256sum CLAUDE.md | awk '{print $1}')
          actual=$(tr -d '[:space:]' < CLAUDE.md.sha256)
          if [ "$expected" != "$actual" ]; then
            echo "CLAUDE.md.sha256 is stale."
            echo "  CLAUDE.md.sha256 contains: $actual"
            echo "  sha256sum CLAUDE.md gives: $expected"
            echo "Regenerate and commit it in the SAME commit as the CLAUDE.md change:"
            echo "  sha256sum CLAUDE.md | awk '{print \$1}' > CLAUDE.md.sha256"
            exit 1
          fi
          echo "CLAUDE.md.sha256 verified: $actual"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install gate deps
        run: pip install pyyaml --quiet
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Python dev dependencies
        # --all-packages: a bare `uv sync` only installs the root workspace
        # package + dev group, not each member's own `dependencies` (FTF-0102
