# FTF-0004 — Docker local stack.
#
# Boots the real infra a local Sovra dev environment needs: PostgreSQL,
# self-hosted Temporal (backed by the same Postgres), and an S3-compatible
# object store via SeaweedFS (the reuse-architecture's qualified fixture —
# see FINE_TUNING_FACTORY_RELEASE_1.md Section 77.3 — not an ad hoc MinIO
# install). `api` is a stdlib-only health-bootstrap process
# (apps/api/app/config/docker_local_stack.py) that really TCP-probes each
# dependency; it is not the product API (that has no runtime dependencies
# approved yet — FastAPI is the frozen target per Section 4, added when a
# task actually builds request handlers, not just to host a health check).
#
# `web` is deliberately not part of this stack yet: apps/web has no
# server-side runtime at all (no Next.js/React installed — adding either
# is a new-runtime-dependency, an ask-first item per CLAUDE.md, not
# something this task invents). Tracked as a follow-up for whichever task
# first builds the real web app.
#
# One documented command boots everything:
#   docker compose -f infra/docker/docker-compose.yml up -d
# Real integration + negative-acceptance evidence: scripts/verify_docker_local_stack.py
# (run in CI — this repo's interactive dev sandbox has no Docker-registry
# egress; see docs/certifications/queue.md for FTF-0004).

name: sovra-local-stack

services:
  postgres:
    image: postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571 # postgres:16-alpine (amd64)
    environment:
      POSTGRES_USER: sovra
      POSTGRES_PASSWORD: sovra_local_dev_only
      POSTGRES_DB: sovra_stack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovra -d sovra_stack"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup@sha256:1ac8202b1d9143028ef8bf57a93dc9bbc61742ddffc4ea193a77be689a84f8bc # 1.24.2 (amd64)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: sovra
      POSTGRES_PWD: sovra_local_dev_only
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  s3:
    image: chrislusf/seaweedfs@sha256:e09c776650619259a23627b5405644396e94ebac49c66d8b89024ebfd85581dc # 3.99 (amd64)
    # FTF-R017: bumped from 3.71 -> 3.99 (digest verified via Docker Hub's
    # metadata API, no pull needed -- same no-pull verification FTF-0004
    # already established). 3.71 genuinely predates S3 object
    # versioning/object-lock and returned a generic 500 instead of
    # BadDigest for a corrupted upload -- confirmed against 3.71's own
    # real GitHub Actions run (7/9 storage-semantics tests failing with
    # real, non-signing SeaweedFS responses) and independently
    # re-confirmed here by reading 3.99's actual source on GitHub before
    # pushing, not by trusting a web summary: weed/s3api/
    # s3api_bucket_handlers.go has a real PutBucketVersioningHandler/
    # GetBucketVersioningHandler (with real object-lock/versioning-state
    # interaction, e.g. rejecting a versioning-suspend while object lock
    # is enabled) and weed/s3api/s3api_object_handlers_put.go maps a
    # digest mismatch to s3err.ErrBadDigest, not a generic 500 -- both
    # absent/wrong in 3.71. -s3.config/-s3.port/-master.volumeSizeLimitMB
    # all still exist unchanged in 3.99's weed/command/server.go, so this
    # is a pure version bump, not a command-line migration.
    # -s3.config points at a real identity file (no "anonymous"
    # entry) so the fixture actually enforces caller identity (Section
    # 65.2) instead of SeaweedFS's own unconfigured default of accepting
    # any access key -- see seaweedfs-s3-identity.json for the real
    # credential and the negative-acceptance test it backs.
    # -master.volumeSizeLimitMB=64: the CI run of tests/integration/
    # test_storage_semantics.py failed for real with SeaweedFS's own
    # "no free volumes left"/"Not enough data nodes found" errors, read
    # directly from `docker compose logs s3` -- confirmed by tracing this
    # container's real boot log, not assumed. Cause: SeaweedFS's default
    # (30000MB) volume-size assumption makes its master auto-compute a
    # very low max-volume ceiling for the GitHub Actions runner's actual
    # free disk space, and each unique bucket this test creates is its own
    # SeaweedFS "collection", which eagerly grows up to 7 volumes on first
    # write -- the runner ran out of computed volume headroom after only
    # 2 of this test's ~11 unique buckets. 64MB comfortably holds every
    # object/part this test suite writes (its largest is a 5MB multipart
    # part) while letting the master's own capacity math fit far more
    # volumes in the same real disk space. -master.volumePreallocate is
    # left at its own default (false) -- unrelated to this fix, and
    # changing it would risk masking a real future capacity regression.
    command: server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3-identity.json
      -master.volumeSizeLimitMB=64
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
      - ./seaweedfs-s3-identity.json:/etc/seaweedfs/s3-identity.json:ro

  api:
    image: python@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72 # python:3.11-slim (amd64)
    working_dir: /app
    volumes:
      - ../../apps/api:/app/apps/api:ro
    command:
      [
        "python3",
        "-m",
        "app.config.docker_local_stack",
        "--serve",
      ]
    environment:
      PYTHONPATH: /app/apps/api
      SOVRA_STACK_POSTGRES_HOST: postgres
      SOVRA_STACK_POSTGRES_PORT: "5432"
      SOVRA_STACK_TEMPORAL_HOST: temporal
      SOVRA_STACK_TEMPORAL_PORT: "7233"
      SOVRA_STACK_S3_HOST: s3
      SOVRA_STACK_S3_PORT: "8333"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - temporal
      - s3

volumes:
  postgres_data:
  s3_data:
